name: MaterialDNA Luau Fix One-Shot

on:
  push:
    branches:
      - agent/materials/5-v1-exact-shape-sol7c3e

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Fix plain-table type narrowing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/shared/Materials/MaterialDNA.luau')
          text = p.read_text()
          old = '''local function asTable(errors: { string }, path: string, value: unknown): any?
          \tif type(value) ~= "table" then
          \t\tappendError(errors, `{path} must be a table`)
          \t\treturn nil
          \tend
          \tif getmetatable(value) ~= nil then
          \t\tappendError(errors, `{path} must be a plain table with no metatable`)
          \t\treturn nil
          \tend
          \treturn value :: any
          end
          '''
          new = '''local function asTable(errors: { string }, path: string, value: unknown): any?
          \tif type(value) ~= "table" then
          \t\tappendError(errors, `{path} must be a table`)
          \t\treturn nil
          \tend
          \tlocal tableValue = value :: any
          \tif getmetatable(tableValue) ~= nil then
          \t\tappendError(errors, `{path} must be a plain table with no metatable`)
          \t\treturn nil
          \tend
          \treturn tableValue
          end
          '''
          if text.count(old) != 1:
              raise SystemExit('expected one asTable implementation')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check
      - name: Verify format and Luau analysis
        shell: bash
        run: |
          stylua src/shared/Materials/MaterialDNA.luau
          rojo sourcemap default.project.json --output sourcemap.json
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.69.0/scripts/globalTypes.d.luau \
            -o globalTypes.d.luau
          luau-lsp analyze --platform=roblox --definitions:@roblox=globalTypes.d.luau --sourcemap=sourcemap.json src
      - name: Commit fix and remove temporary diagnostics
        shell: bash
        run: |
          git rm .github/workflows/materialdna-luau-fix-once.yml materialdna-luau-diagnostic.txt
          git add src/shared/Materials/MaterialDNA.luau
          git config user.name "unrendered-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(materials): narrow validated table before metatable check"
          git push
