name: Patch Physics Lab resolved-region integration

on:
  push:
    branches:
      - agent/physicslab/10-resolved-region-integration-sol56g7

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/physicslab/10-resolved-region-integration-sol56g7

      - name: Apply resolved-region integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          recipe = Path('src/shared/Physics/PhysicsLabRecipe.luau')
          text = recipe.read_text()

          old = '''local ObjectGenomeFixtures = require(script.Parent.Parent.Objects.ObjectGenomeFixtures)
          local WorldEntity = require(script.Parent.Parent.Reality.WorldEntity)
          local PhysicsLabObjectGenomes = require(script.Parent.PhysicsLabObjectGenomes)
          '''
          new = '''local ObjectGenomeFixtures = require(script.Parent.Parent.Objects.ObjectGenomeFixtures)
          local ResolvedRegionRecipe = require(script.Parent.Parent.Reality.ResolvedRegionRecipe)
          local WorldEntity = require(script.Parent.Parent.Reality.WorldEntity)
          local PhysicsLabObjectGenomes = require(script.Parent.PhysicsLabObjectGenomes)
          '''
          if old not in text:
              raise SystemExit('recipe require marker not found')
          text = text.replace(old, new, 1)

          old = '''export type PhysicsLabRecipe = {
          \tschemaVersion: number,
          \trecipeKey: string,
          \tworldId: string,
          \tregionId: string,
          \tentities: { EntityRecipe },
          }
          '''
          new = '''export type PhysicsLabRecipe = {
          \tschemaVersion: number,
          \trecipeKey: string,
          \tworldId: string,
          \tregionId: string,
          \tresolvedRegion: ResolvedRegionRecipe.Recipe,
          \tentities: { EntityRecipe },
          }
          '''
          if old not in text:
              raise SystemExit('recipe type marker not found')
          text = text.replace(old, new, 1)

          old = '''PhysicsLabRecipe.SCHEMA_VERSION = 1
          PhysicsLabRecipe.GENERATOR_VERSION = 1
          PhysicsLabRecipe.RECIPE_KEY = "physics-lab.hero-gate.v1"

          local WORLD_ID = StableId.fromParts("world", { "physics-lab", "hero-gate", "v1" })
          local REGION_ID = StableId.fromParts("region", { "physics-lab", "bay-a", "v1" })
          '''
          new = '''PhysicsLabRecipe.SCHEMA_VERSION = 2
          PhysicsLabRecipe.GENERATOR_VERSION = 2
          PhysicsLabRecipe.RECIPE_KEY = "physics-lab.hero-gate.v2"

          local WORLD_ID = StableId.fromParts("world", { "physics-lab", "hero-gate", "v1" })
          -- This is established lab truth, so generator versions are pinned explicitly instead of
          -- consulting currentGeneratorVersions() and silently drifting when future generators land.
          local RESOLVED_REGION = ResolvedRegionRecipe.lock({
          \tworldSeedRef = "physics-lab.hero-gate.world-seed.v1",
          \tregionAddress = {
          \t\tx = 0,
          \t\tz = 0,
          \t\tlayer = 0,
          \t},
          \tgeneratorVersions = {
          \t\treality = 1,
          \t\ttopology = 1,
          \t\tmaterial = 1,
          \t\tobject = 1,
          \t\tentity = 1,
          \t},
          \tsemanticIntentKey = "physics-lab.hero-gate.office-bay.v1",
          \ttopologyAnchors = {
          \t\t"front-threshold/door-main",
          \t},
          \tcanonicalContentKeys = {
          \t\t"floor",
          \t\t"ceiling",
          \t\t"wall-left",
          \t\t"wall-right",
          \t\t"wall-back",
          \t\t"wall-front-left",
          \t\t"wall-front-right",
          \t\t"wall-front-header",
          \t\t"ramp",
          \t\t"ledge",
          \t\t"stair-1",
          \t\t"stair-2",
          \t\t"stair-3",
          \t\t"stair-4",
          \t\t"character-spawn-anchor",
          \t\t"door-main",
          \t\t"chair-a",
          \t\t"table-a",
          \t\t"cabinet-a",
          \t\t"cart-a",
          \t},
          })
          '''
          if old not in text:
              raise SystemExit('recipe version/region marker not found')
          text = text.replace(old, new, 1)

          if '\t\tregionId = REGION_ID,\n' not in text:
              raise SystemExit('origin region marker not found')
          text = text.replace('\t\tregionId = REGION_ID,\n', '\t\tregionId = RESOLVED_REGION.regionId,\n', 1)

          old = '''\t\tworldId = WORLD_ID,
          \t\tregionId = REGION_ID,
          \t\tentities = table.freeze(entities),
          '''
          new = '''\t\tworldId = WORLD_ID,
          \t\tregionId = RESOLVED_REGION.regionId,
          \t\tresolvedRegion = RESOLVED_REGION,
          \t\tentities = table.freeze(entities),
          '''
          if old not in text:
              raise SystemExit('recipe return region marker not found')
          text = text.replace(old, new, 1)
          recipe.write_text(text)

          test = Path('tests/physics_lab_recipe.luau')
          text = test.read_text()
          marker = 'local PhysicsLabRecipe = ProductionLoader.requireShared("Physics/PhysicsLabRecipe")\n'
          addition = marker + 'local ResolvedRegionRecipe = ProductionLoader.requireShared("Reality/ResolvedRegionRecipe")\n'
          if marker not in text:
              raise SystemExit('test require marker not found')
          text = text.replace(marker, addition, 1)

          marker = '''\texpect(
          \t\t"lab region id is deterministic",
          \t\tfirst.regionId == second.regionId and StableId.is(first.regionId, "region")
          \t)
          '''
          addition = marker + '''\texpect("lab region id is owned by resolved-region truth", first.regionId == first.resolvedRegion.regionId)
          \texpect(
          \t\t"lab resolved-region recipe is deterministic",
          \t\tResolvedRegionRecipe.equal(first.resolvedRegion, second.resolvedRegion)
          \t)
          \tlocal reconstructedRegion = ResolvedRegionRecipe.deserialize(ResolvedRegionRecipe.serialize(first.resolvedRegion))
          \texpect(
          \t\t"lab resolved-region recipe reconstructs exactly",
          \t\tResolvedRegionRecipe.equal(first.resolvedRegion, reconstructedRegion)
          \t)
          \texpect(
          \t\t"lab resolved-region repro identity is deterministic",
          \t\tResolvedRegionRecipe.reproKey(first.resolvedRegion) == ResolvedRegionRecipe.reproKey(second.resolvedRegion)
          \t)
          \texpect(
          \t\t"lab resolved-region versions are explicitly locked",
          \t\tfirst.resolvedRegion.generatorVersions.reality == 1
          \t\t\tand first.resolvedRegion.generatorVersions.topology == 1
          \t\t\tand first.resolvedRegion.generatorVersions.material == 1
          \t\t\tand first.resolvedRegion.generatorVersions.object == 1
          \t\t\tand first.resolvedRegion.generatorVersions.entity == 1
          \t)
          '''
          if marker not in text:
              raise SystemExit('region test marker not found')
          text = text.replace(marker, addition, 1)

          marker = '''\tlocal seenKeys = {}
          \tlocal seenIds = {}
          \tlocal registry = WorldEntity.createRegistry()
          '''
          addition = '''\tlocal seenKeys = {}
          \tlocal seenIds = {}
          \tlocal resolvedContentKeys = {}
          \tfor _, key in ipairs(first.resolvedRegion.canonicalContentKeys) do
          \t\tresolvedContentKeys[key] = true
          \tend
          \tlocal allEntitiesBelongToResolvedBase = true
          \tlocal registry = WorldEntity.createRegistry()
          '''
          if marker not in text:
              raise SystemExit('test key-set marker not found')
          text = text.replace(marker, addition, 1)

          marker = '''\t\tseenKeys[entityRecipe.key] = true
          \t\tif seenIds[entityRecipe.entity.id] then
          '''
          addition = '''\t\tseenKeys[entityRecipe.key] = true
          \t\tif not resolvedContentKeys[entityRecipe.key] then
          \t\t\tallEntitiesBelongToResolvedBase = false
          \t\tend
          \t\tif seenIds[entityRecipe.entity.id] then
          '''
          if marker not in text:
              raise SystemExit('test loop marker not found')
          text = text.replace(marker, addition, 1)

          marker = '''\texpect("lab entity sequence is deterministic", deterministicEntries)
          \texpect("lab includes every required shell/object key", allRequiredKeysPresent)
          '''
          addition = '''\texpect("lab entity sequence is deterministic", deterministicEntries)
          \texpect("lab includes every required shell/object key", allRequiredKeysPresent)
          \texpect(
          \t\t"lab resolved-region base accounts for every placed entity",
          \t\tallEntitiesBelongToResolvedBase and #first.resolvedRegion.canonicalContentKeys == #first.entities
          \t)
          '''
          if marker not in text:
              raise SystemExit('test expectation marker not found')
          text = text.replace(marker, addition, 1)
          test.write_text(text)

          realizer = Path('src/server/PhysicsLab/PhysicsLabRealizer.luau')
          text = realizer.read_text()
          marker = '''local FidelityManager = require(Shared.Physics.FidelityManager)
          local PhysicsLabRecipe = require(Shared.Physics.PhysicsLabRecipe)
          local WorldEntity = require(Shared.Reality.WorldEntity)
          '''
          addition = '''local FidelityManager = require(Shared.Physics.FidelityManager)
          local PhysicsLabRecipe = require(Shared.Physics.PhysicsLabRecipe)
          local ResolvedRegionRecipe = require(Shared.Reality.ResolvedRegionRecipe)
          local WorldEntity = require(Shared.Reality.WorldEntity)
          '''
          if marker not in text:
              raise SystemExit('realizer require marker not found')
          text = text.replace(marker, addition, 1)

          marker = '''\tmodel:SetAttribute("UNRENDERED_WorldId", recipe.worldId)
          \tmodel:SetAttribute("UNRENDERED_RegionId", recipe.regionId)
          '''
          addition = '''\tmodel:SetAttribute("UNRENDERED_WorldId", recipe.worldId)
          \tmodel:SetAttribute("UNRENDERED_RegionId", recipe.regionId)
          \tmodel:SetAttribute("UNRENDERED_ResolvedRegionFingerprint", recipe.resolvedRegion.recipeFingerprint)
          \tmodel:SetAttribute("UNRENDERED_ResolvedRegionReproKey", ResolvedRegionRecipe.reproKey(recipe.resolvedRegion))
          '''
          if marker not in text:
              raise SystemExit('realizer attribute marker not found')
          text = text.replace(marker, addition, 1)
          realizer.write_text(text)

          docs = Path('Docs/PHYSICS_LAB_VALIDATION.md')
          text = docs.read_text()
          marker = '- Physics Lab recipe/schema version and deterministic recipe fingerprint/repro key when the lab exposes them,\n'
          replacement = '''- Physics Lab recipe/schema version,
          - locked resolved-region ID/fingerprint/repro key exposed by the lab root diagnostics,
          '''
          if marker not in text:
              raise SystemExit('validation evidence marker not found')
          text = text.replace(marker, replacement, 1)
          docs.write_text(text)
          PY

      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check

      - name: Format changed Luau
        run: stylua src tests

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/Physics/PhysicsLabRecipe.luau src/server/PhysicsLab/PhysicsLabRealizer.luau tests/physics_lab_recipe.luau Docs/PHYSICS_LAB_VALIDATION.md
          git commit -m "fix(physicslab): consume resolved-region identity"
          git push origin HEAD:agent/physicslab/10-resolved-region-integration-sol56g7
