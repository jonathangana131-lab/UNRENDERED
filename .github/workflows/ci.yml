name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install Rokit
        run: |
          cargo install rokit --version 1.2.0 --locked
          rokit install

      - name: Generate Rojo sourcemap
        run: rojo sourcemap default.project.json --output sourcemap.json

      - name: Format check
        run: stylua --check src tests

      - name: Lint
        run: selene src tests

      - name: Luau analysis
        run: luau-lsp analyze --platform=roblox --sourcemap=sourcemap.json src tests

      - name: Pure Luau tests
        run: lune run tests/run

      - name: Build place file
        run: |
          mkdir -p build
          rojo build default.project.json --output build/UNRENDERED.rbxlx

      - name: Upload build shell
        uses: actions/upload-artifact@v4
        with:
          name: unrendered-rbxlx
          path: build/UNRENDERED.rbxlx
          retention-days: 7
