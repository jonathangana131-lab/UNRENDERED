name: Validate Physics Lab sol56k2

on:
  push:
    branches:
      - agent/physicslab/10-production-shell-sol56k2

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/physicslab/10-production-shell-sol56k2
          fetch-depth: 0

      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check

      - name: Apply ObjectState refinement
        shell: bash
        run: |
          python3 .github/scripts/apply_physics_lab_object_state_sol56k2.py
          stylua src tests

      - name: Validate full source contract
        shell: bash
        run: |
          stylua --check src tests
          selene src tests
          lune run tests/run
          rojo build default.project.json -o /tmp/unrendered.rbxlx

      - name: Commit validated patch and retire transport
        shell: bash
        run: |
          git rm .github/workflows/validate-physics-lab-sol56k2.yml .github/scripts/apply_physics_lab_object_state_sol56k2.py
          git add Docs/PHYSICS_LAB.md src/shared/Physics/PhysicsLabRecipe.luau tests/physics_lab_recipe.luau
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(physicslab): bind landed object state contracts"
          git push origin HEAD:agent/physicslab/10-production-shell-sol56k2
