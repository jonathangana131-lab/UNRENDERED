name: Apply mechanism-state repair

on:
  push:
    branches:
      - agent/objects/101-mechanism-state-sol56j9

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/objects/101-mechanism-state-sol56j9
          fetch-depth: 0

      - name: Apply repair
        run: python3 .github/scripts/apply_mechanism_state_repair.py

      - name: Remove one-shot patch machinery
        run: rm .github/scripts/apply_mechanism_state_repair.py .github/workflows/apply-mechanism-state-repair.yml

      - name: Commit mechanism-state repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Lock ObjectGenome mechanism state semantics"
          git push origin HEAD:agent/objects/101-mechanism-state-sol56j9
