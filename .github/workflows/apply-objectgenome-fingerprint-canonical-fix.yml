name: Apply ObjectGenome fingerprint canonical fix

on:
  push:
    branches:
      - agent/objects/100-fingerprint-canonical-sol56u3

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply canonical ObjectGenome fingerprint repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/objects/100-fingerprint-canonical-sol56u3
          fetch-depth: 0

      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check

      - name: Apply production and regression patch
        run: python3 .github/scripts/apply_objectgenome_fingerprint_canonical_fix.py

      - name: Format patched Luau before fingerprint probe
        run: stylua src/shared/Objects/ObjectGenome.luau tests/object_genome.luau

      - name: Generate corrected fixture fingerprint goldens
        shell: bash
        run: |
          cat > tests/_fingerprint_probe.luau <<'LUAU'
          local ProductionLoader = require("./support/ProductionLoader")
          local ObjectGenome = ProductionLoader.requireShared("Objects/ObjectGenome")
          local Fixtures = ProductionLoader.requireShared("Objects/ObjectGenomeFixtures")

          print("officeChair=" .. ObjectGenome.recipeFingerprint(Fixtures.officeChair))
          print("officeTable=" .. ObjectGenome.recipeFingerprint(Fixtures.officeTable))
          print("filingCabinet=" .. ObjectGenome.recipeFingerprint(Fixtures.filingCabinet))
          LUAU
          lune run tests/_fingerprint_probe > /tmp/objectgenome-fingerprints.txt
          cat /tmp/objectgenome-fingerprints.txt
          python3 .github/scripts/apply_objectgenome_fingerprint_canonical_fix.py \
            --goldens /tmp/objectgenome-fingerprints.txt
          rm tests/_fingerprint_probe.luau
          stylua src/shared/Objects/ObjectGenome.luau tests/object_genome.luau

      - name: Validate repaired source
        shell: bash
        run: |
          stylua --check src tests
          selene src tests
          lune run tests/run
          mkdir -p build
          rojo build default.project.json --output build/UNRENDERED.rbxlx

      - name: Retire transport and commit repair
        shell: bash
        run: |
          rm .github/scripts/apply_objectgenome_fingerprint_canonical_fix.py
          rm .github/workflows/apply-objectgenome-fingerprint-canonical-fix.yml
          git config user.name "unrendered-swarm"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Apply canonical ObjectGenome fingerprint repair"
          git push origin HEAD:agent/objects/100-fingerprint-canonical-sol56u3
