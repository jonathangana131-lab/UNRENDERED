name: MaterialDNA Type Fix One-Shot

on:
  push:
    branches:
      - agent/materials/5-v1-exact-shape-sol7c3e

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Annotate exact-shape key maps
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/shared/Materials/MaterialDNA.luau')
          text = p.read_text()
          names = [
              'RECIPE_FIELDS', 'SUBSTRATE_FIELDS', 'FINISH_FIELDS', 'COLOR_FIELDS',
              'INSTALLATION_FIELDS', 'MAINTENANCE_FIELDS', 'ENVIRONMENT_FIELDS',
              'HISTORY_EVENT_FIELDS', 'VISUAL_FIELDS', 'PHYSICAL_FIELDS',
              'ACOUSTIC_FIELDS', 'RESPONSE_FIELDS', 'STATE_FIELDS',
          ]
          for name in names:
              old = f'local {name} = table.freeze('
              new = f'local {name}: {{ [string]: boolean }} = table.freeze('
              if text.count(old) != 1:
                  raise SystemExit(f'{name}: expected one unannotated declaration')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check
      - name: Format changed Luau
        run: stylua src/shared/Materials/MaterialDNA.luau
      - name: Commit type fix and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/materialdna-type-fix-once.yml
          git add src/shared/Materials/MaterialDNA.luau
          git config user.name "unrendered-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(materials): type exact-shape key maps"
          git push
