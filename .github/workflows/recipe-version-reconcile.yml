name: TEMP MaterialDNA recipe-version reconciliation

on:
  push:
    branches: [agent/materials/5-recipe-version-reconcile-sol56z9]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/materials/5-recipe-version-reconcile-sol56z9
      - name: Apply reviewed recipe-version reconciliation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(text, old, new, count=1, label="replacement"):
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{label}: expected {count} matches, found {actual}")
              return text.replace(old, new)

          material_path = Path("src/shared/Materials/MaterialDNA.luau")
          text = material_path.read_text()
          text = replace_exact(
              text,
              "local SCHEMA_VERSION = 1\nlocal MAX_HISTORY_EVENTS = 32",
              "local SCHEMA_VERSION = 1\nlocal MAX_RECIPE_VERSION = 2147483647\nlocal MAX_HISTORY_EVENTS = 32",
              label="recipe version bound",
          )
          text = replace_exact(
              text,
              "\tid: MaterialId,\n\tschemaVersion: number,\n\tcoherenceClass: string,",
              "\tid: MaterialId,\n\tschemaVersion: number,\n\trecipeVersion: number,\n\tcoherenceClass: string,",
              label="recipe type",
          )
          text = replace_exact(
              text,
              "export type MaterialState = {\n\trecipeId: MaterialId,\n\tschemaVersion: number,",
              "export type MaterialState = {\n\trecipeId: MaterialId,\n\trecipeVersion: number,\n\tschemaVersion: number,",
              label="state type",
          )
          text = replace_exact(
              text,
              '\t"schemaVersion",\n\t"coherenceClass",',
              '\t"schemaVersion",\n\t"recipeVersion",\n\t"coherenceClass",',
              label="recipe fields",
          )
          text = replace_exact(
              text,
              'local STATE_FIELDS = fieldSet({ "recipeId", "schemaVersion", "wear01", "damage01", "wetness01", "soil01" })',
              'local STATE_FIELDS =\n\tfieldSet({ "recipeId", "recipeVersion", "schemaVersion", "wear01", "damage01", "wetness01", "soil01" })',
              label="state fields",
          )
          text = replace_exact(
              text,
              '\tif getmetatable(record) ~= nil then\n\t\tappendError(errors, `{path} must be a plain table without a metatable`)\n\tend\n\treturn record',
              '\tif getmetatable(record) ~= nil then\n\t\tappendError(errors, `{path} must be a plain table without a metatable`)\n\t\treturn nil\n\tend\n\treturn record',
              label="metatable early rejection",
          )
          helper_anchor = '''local function validateNonNegativeInteger(errors: { string }, path: string, value: unknown): number?\n\tif type(value) ~= "number" or not isFinite(value) or value < 0 or math.floor(value) ~= value then\n\t\tappendError(errors, `{path} must be a finite non-negative integer`)\n\t\treturn nil\n\tend\n\treturn value\nend\n'''
          helper_replacement = helper_anchor + '''\nlocal function validatePositiveInteger(errors: { string }, path: string, value: unknown): number?\n\tif\n\t\ttype(value) ~= "number"\n\t\tor not isFinite(value)\n\t\tor value < 1\n\t\tor value > MAX_RECIPE_VERSION\n\t\tor math.floor(value) ~= value\n\tthen\n\t\tappendError(errors, `{path} must be a positive integer in [1, {MAX_RECIPE_VERSION}]`)\n\t\treturn nil\n\tend\n\treturn value\nend\n'''
          text = replace_exact(text, helper_anchor, helper_replacement, label="positive integer helper")
          text = replace_exact(
              text,
              '''\tif type(recipe.schemaVersion) ~= "number" or recipe.schemaVersion ~= SCHEMA_VERSION then\n\t\tappendError(errors, `schemaVersion must be {SCHEMA_VERSION}`)\n\tend\n\tlocal coherenceClass''',
              '''\tif type(recipe.schemaVersion) ~= "number" or recipe.schemaVersion ~= SCHEMA_VERSION then\n\t\tappendError(errors, `schemaVersion must be {SCHEMA_VERSION}`)\n\tend\n\tvalidatePositiveInteger(errors, "recipeVersion", recipe.recipeVersion)\n\tlocal coherenceClass''',
              label="recipe validation",
          )
          text = replace_exact(
              text,
              '''\tvalidateProjectKey(errors, "recipeId", state.recipeId)\n\tif type(state.schemaVersion) ~= "number" or state.schemaVersion ~= SCHEMA_VERSION then''',
              '''\tvalidateProjectKey(errors, "recipeId", state.recipeId)\n\tvalidatePositiveInteger(errors, "recipeVersion", state.recipeVersion)\n\tif type(state.schemaVersion) ~= "number" or state.schemaVersion ~= SCHEMA_VERSION then''',
              label="state validation",
          )
          state_assert = '''function MaterialDNA.assertValidState(value: unknown): MaterialState\n\tlocal result = MaterialDNA.validateState(value)\n\tassert(result.ok, table.concat(result.errors, "; "))\n\treturn value :: MaterialState\nend\n'''
          state_match = state_assert + '''\nfunction MaterialDNA.stateMatchesRecipe(recipe: MaterialRecipe, state: MaterialState): boolean\n\treturn state.recipeId == recipe.id\n\t\tand state.recipeVersion == recipe.recipeVersion\n\t\tand state.schemaVersion == recipe.schemaVersion\nend\n'''
          text = replace_exact(text, state_assert, state_match, label="state recipe match")
          text = replace_exact(
              text,
              '''\t\tid = source.id,\n\t\tschemaVersion = source.schemaVersion,\n\t\tcoherenceClass = source.coherenceClass,''',
              '''\t\tid = source.id,\n\t\tschemaVersion = source.schemaVersion,\n\t\trecipeVersion = source.recipeVersion,\n\t\tcoherenceClass = source.coherenceClass,''',
              label="freeze recipe version",
          )
          old_default = '''function MaterialDNA.defaultState(recipeId: MaterialId): MaterialState\n\tlocal state: MaterialState = {\n\t\trecipeId = recipeId,\n\t\tschemaVersion = SCHEMA_VERSION,\n\t\twear01 = 0,\n\t\tdamage01 = 0,\n\t\twetness01 = 0,\n\t\tsoil01 = 0,\n\t}\n\tMaterialDNA.assertValidState(state)\n\treturn state\nend'''
          new_default = '''function MaterialDNA.defaultState(recipe: MaterialRecipe): MaterialState\n\tlocal source = MaterialDNA.assertValidRecipe(recipe)\n\tlocal state: MaterialState = {\n\t\trecipeId = source.id,\n\t\trecipeVersion = source.recipeVersion,\n\t\tschemaVersion = source.schemaVersion,\n\t\twear01 = 0,\n\t\tdamage01 = 0,\n\t\twetness01 = 0,\n\t\tsoil01 = 0,\n\t}\n\tMaterialDNA.assertValidState(state)\n\treturn state\nend'''
          text = replace_exact(text, old_default, new_default, label="default state exact recipe")
          material_path.write_text(text)

          catalog_path = Path("src/shared/Materials/MaterialFixtureCatalog.luau")
          catalog = catalog_path.read_text()
          old = "\t\tschemaVersion = MaterialDNA.SchemaVersion,\n\t\tcoherenceClass ="
          new = "\t\tschemaVersion = MaterialDNA.SchemaVersion,\n\t\trecipeVersion = 1,\n\t\tcoherenceClass ="
          catalog = replace_exact(catalog, old, new, count=3, label="production fixture revisions")
          catalog_path.write_text(catalog)

          tests_path = Path("tests/materialdna_contract.luau")
          tests = tests_path.read_text()
          tests = replace_exact(
              tests,
              "\t\t\tschemaVersion = MaterialDNA.SchemaVersion,\n\t\t\tcoherenceClass =",
              "\t\t\tschemaVersion = MaterialDNA.SchemaVersion,\n\t\t\trecipeVersion = 1,\n\t\t\tcoherenceClass =",
              label="test recipe revision",
          )
          metatable_block = '''\tlocal metatableResult = MaterialDNA.validateRecipe(metatableRecipe)\n\texpect(\n\t\t"metatable-backed canonical recipe rejected",\n\t\tnot metatableResult.ok and containsError(metatableResult, "without a metatable"),\n\t\ttable.concat(metatableResult.errors, "; ")\n\t)\n'''
          hostile_block = metatable_block + '''\n\tlocal hostileReads = 0\n\tlocal hostileRecipe: any = {}\n\tsetmetatable(hostileRecipe, {\n\t\t__index = function()\n\t\t\thostileReads += 1\n\t\t\treturn nil\n\t\tend,\n\t})\n\tlocal hostileResult = MaterialDNA.validateRecipe(hostileRecipe)\n\texpect(\n\t\t"metatable recipe rejected before structural reads",\n\t\tnot hostileResult.ok and hostileReads == 0 and containsError(hostileResult, "without a metatable"),\n\t\t`reads={hostileReads}; {table.concat(hostileResult.errors, "; ")}`\n\t)\n'''
          tests = replace_exact(tests, metatable_block, hostile_block, label="metatable no-read regression")
          fixture_loop_anchor = '''\t\tlocal fixtureResult = MaterialDNA.validateRecipe(fixture)\n\t\texpect(\n\t\t\t`production fixture {fixtureName} validates`,\n\t\t\tfixtureResult.ok,\n\t\t\ttable.concat(fixtureResult.errors, "; ")\n\t\t)\n'''
          fixture_loop_replacement = fixture_loop_anchor + '''\t\texpect(\n\t\t\t`production fixture {fixtureName} has exact recipe revision`,\n\t\t\tfixture.recipeVersion == 1,\n\t\t\t`tostring={tostring(fixture.recipeVersion)}`\n\t\t)\n'''
          tests = replace_exact(tests, fixture_loop_anchor, fixture_loop_replacement, label="fixture revision regression")
          old_state = '''\tlocal state = MaterialDNA.defaultState("material.v1.test.wallpaper")\n\tlocal stateMutation = pcall(function()'''
          revision_tests = '''\tlocal invalidRecipeVersion = makeRecipe()\n\tinvalidRecipeVersion.recipeVersion = 0\n\tlocal recipeVersionResult = MaterialDNA.validateRecipe(invalidRecipeVersion)\n\texpect(\n\t\t"non-positive recipe version rejected",\n\t\tnot recipeVersionResult.ok and containsError(recipeVersionResult, "recipeVersion"),\n\t\ttable.concat(recipeVersionResult.errors, "; ")\n\t)\n\n\tlocal revisionOne = MaterialDNA.freezeRecipe(makeRecipe())\n\tlocal revisionTwoSource = makeRecipe()\n\trevisionTwoSource.recipeVersion = 2\n\trevisionTwoSource.physical.staticFriction = 0.61\n\tlocal revisionTwo = MaterialDNA.freezeRecipe(revisionTwoSource)\n\tlocal revisionOneState = MaterialDNA.defaultState(revisionOne)\n\tlocal revisionTwoState = MaterialDNA.defaultState(revisionTwo)\n\texpect(\n\t\t"state captures exact recipe revision",\n\t\trevisionOneState.recipeId == revisionOne.id and revisionOneState.recipeVersion == 1,\n\t\t`{revisionOneState.recipeId}@{revisionOneState.recipeVersion}`\n\t)\n\texpect(\n\t\t"same material id revisions stay distinct",\n\t\trevisionOne.id == revisionTwo.id\n\t\t\tand revisionOne.recipeVersion ~= revisionTwo.recipeVersion\n\t\t\tand MaterialDNA.stateMatchesRecipe(revisionOne, revisionOneState)\n\t\t\tand not MaterialDNA.stateMatchesRecipe(revisionTwo, revisionOneState)\n\t\t\tand MaterialDNA.stateMatchesRecipe(revisionTwo, revisionTwoState),\n\t\t"state did not preserve exact recipe revision identity"\n\t)\n\n\tlocal state = MaterialDNA.defaultState(makeRecipe())\n\tlocal stateMutation = pcall(function()'''
          tests = replace_exact(tests, old_state, revision_tests, label="revision identity tests")
          tests = replace_exact(
              tests,
              '''\tlocal invalidState: any = {\n\t\trecipeId = "material.v1.test.wallpaper",\n\t\tschemaVersion = MaterialDNA.SchemaVersion,''',
              '''\tlocal invalidState: any = {\n\t\trecipeId = "material.v1.test.wallpaper",\n\t\trecipeVersion = 1,\n\t\tschemaVersion = MaterialDNA.SchemaVersion,''',
              label="invalid state revision",
          )
          tests_path.write_text(tests)

          docs_path = Path("Docs/MATERIAL_DNA_CONTRACT.md")
          docs = docs_path.read_text()
          docs = replace_exact(
              docs,
              "A `MaterialRecipe` is canonical identity/history data. Call `MaterialDNA.freezeRecipe(input)` when a recipe becomes owned by the resolved world or a fixture/catalog. The function validates, deep-copies, and deep-freezes the complete recipe tree. Mutating the caller's input after that boundary cannot rewrite canonical material truth.",
              "A `MaterialRecipe` is canonical identity/history data. Its exact identity is `id + recipeVersion`; `schemaVersion` only versions the record shape. Call `MaterialDNA.freezeRecipe(input)` when a recipe becomes owned by the resolved world or a fixture/catalog. The function validates, deep-copies, and deep-freezes the complete recipe tree. Mutating the caller's input after that boundary cannot rewrite canonical material truth.",
              label="docs ownership version",
          )
          docs = replace_exact(
              docs,
              "`MaterialState` is intentionally separate and mutable. It carries runtime/durable deltas such as wear, damage, wetness, and soil. Representation demotion/persistence should capture state without modifying the immutable recipe.",
              "`MaterialState` is intentionally separate and mutable. It carries the exact `recipeId + recipeVersion + schemaVersion` reference alongside runtime/durable deltas such as wear, damage, wetness, and soil. `MaterialDNA.defaultState(recipe)` binds a state to a validated recipe revision, and `stateMatchesRecipe` checks that exact relationship. Representation demotion/persistence should capture state without modifying or ambiguously retargeting the immutable recipe.",
              label="docs state version",
          )
          docs = replace_exact(
              docs,
              "`MaterialDNA.SchemaVersion` is currently `1`. Unknown schema versions are rejected. Changing the meaning/shape of established recipe data is a schema migration, not an unversioned refactor. Already-resolved world truth must never silently reinterpret an old recipe under a new schema.",
              "`MaterialDNA.SchemaVersion` is currently `1`. Unknown schema versions are rejected. `recipeVersion` is an independent positive content revision for one stable material `id`: any canonical change to physical, visual, acoustic, history, response, or other recipe meaning increments that revision even when the schema shape is unchanged. Changing the meaning/shape of established recipe data is a schema migration. Already-resolved world truth must never silently reinterpret an old recipe or retarget mutable state to newer material content.",
              label="docs versioning",
          )
          docs_path.write_text(docs)
          PY

          rm .github/workflows/recipe-version-reconcile.yml
          git diff --check
          git config user.name "unrendered-integration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Docs/MATERIAL_DNA_CONTRACT.md src/shared/Materials/MaterialDNA.luau src/shared/Materials/MaterialFixtureCatalog.luau tests/materialdna_contract.luau .github/workflows/recipe-version-reconcile.yml
          git commit -m "Lock exact MaterialDNA recipe revisions"
          git push origin HEAD:agent/materials/5-recipe-version-reconcile-sol56z9
