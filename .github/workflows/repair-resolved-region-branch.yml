name: Repair resolved-region branch

on:
  push:
    branches:
      - agent/reality/9-resolved-region-lock-sol56g7

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/reality/9-resolved-region-lock-sol56g7

      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check

      - name: Apply Reality-Grade review repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          module = Path('src/shared/Reality/ResolvedRegionRecipe.luau')
          text = module.read_text()

          marker = 'ResolvedRegionRecipe.MaxDeltaPayloadNodes = 4096\n'
          replacement = marker + 'ResolvedRegionRecipe.MaxDeltaStringBytes = 4096\n'
          if marker not in text or 'MaxDeltaStringBytes' in text:
              raise SystemExit('constant marker mismatch')
          text = text.replace(marker, replacement, 1)

          old_delta_type = '''export type RegionDelta = {
          \tsequence: number,
          \tkind: string,
          \ttargetKey: string?,
          \tpayload: PlainData,
          }
          '''
          new_delta_type = '''export type RegionDelta = {
          \tbaseSchemaVersion: number,
          \tbaseRegionId: string,
          \tbaseFingerprint: string,
          \tsequence: number,
          \tkind: string,
          \ttargetKey: string?,
          \tpayload: PlainData,
          }
          '''
          if old_delta_type not in text:
              raise SystemExit('RegionDelta type marker mismatch')
          text = text.replace(old_delta_type, new_delta_type, 1)

          old_world = 'local worldId = checkedString("lockInput.worldId", source.worldId, ResolvedRegionRecipe.MaxKeyBytes)\n'
          new_world = old_world + '\tassert(StableId.is(worldId, "world"), "lockInput.worldId must be a canonical world StableId")\n'
          if old_world not in text or 'lockInput.worldId must be a canonical world StableId' in text:
              raise SystemExit('worldId marker mismatch')
          text = text.replace(old_world, new_world, 1)

          old_scalar = '''\tlocal valueType = type(value)
          \tif valueType == "nil" or valueType == "boolean" or valueType == "string" then
          \t\treturn value
          \telseif valueType == "number" then
          '''
          new_scalar = '''\tlocal valueType = type(value)
          \tif valueType == "nil" or valueType == "boolean" then
          \t\treturn value
          \telseif valueType == "string" then
          \t\tlocal stringValue = value :: string
          \t\tassert(
          \t\t\t#stringValue <= ResolvedRegionRecipe.MaxDeltaStringBytes,
          \t\t\t`{path} string value exceeds {ResolvedRegionRecipe.MaxDeltaStringBytes} bytes`
          \t\t)
          \t\treturn stringValue
          \telseif valueType == "number" then
          '''
          if old_scalar not in text:
              raise SystemExit('plain scalar marker mismatch')
          text = text.replace(old_scalar, new_scalar, 1)

          lock_marker = '''function ResolvedRegionRecipe.lockFirstObservation(value: LockInput): ResolvedRegionRecipe
          \treturn buildRecipe(canonicalizeLockInput(value))
          end
          '''
          lock_replacement = lock_marker + '''
          function ResolvedRegionRecipe.resolveFirstObservation(
          \texisting: ResolvedRegionRecipe?,
          \tvalue: LockInput
          ): ResolvedRegionRecipe
          \tlocal candidate = buildRecipe(canonicalizeLockInput(value))
          \tif existing == nil then
          \t\treturn candidate
          \tend

          \tlocal canonicalExisting = ResolvedRegionRecipe.deserialize(existing :: any)
          \tassert(canonicalExisting.worldId == candidate.worldId, "existing truth belongs to a different world")
          \tassert(
          \t\tcanonicalExisting.worldSeedRef == candidate.worldSeedRef,
          \t\t"existing truth belongs to a different world seed"
          \t)
          \tassert(canonicalExisting.regionId == candidate.regionId, "existing truth belongs to a different region")
          \treturn canonicalExisting
          end
          '''
          if lock_marker not in text or 'resolveFirstObservation' in text:
              raise SystemExit('first-observation marker mismatch')
          text = text.replace(lock_marker, lock_replacement, 1)

          start = text.index('function ResolvedRegionRecipe.newDelta(')
          end = text.index('\nfunction ResolvedRegionRecipe.lockInput', start)
          new_delta = '''function ResolvedRegionRecipe.newDelta(
          \trecipe: ResolvedRegionRecipe,
          \tsequence: number,
          \tkind: string,
          \ttargetKey: string?,
          \tpayload: PlainData?
          ): RegionDelta
          \tlocal canonicalRecipe = ResolvedRegionRecipe.deserialize(recipe :: any)
          \tlocal canonicalSequence = checkedPositiveInteger("delta.sequence", sequence, MAX_SAFE_INTEGER)
          \tlocal canonicalKind = checkedString("delta.kind", kind, ResolvedRegionRecipe.MaxKeyBytes)
          \tlocal canonicalTarget: string? = nil
          \tif targetKey ~= nil then
          \t\tcanonicalTarget = checkedString("delta.targetKey", targetKey, ResolvedRegionRecipe.MaxKeyBytes)
          \tend
          \tlocal payloadValue: unknown = payload
          \tif payloadValue == nil then
          \t\tpayloadValue = {}
          \tend
          \tlocal canonicalPayload = clonePlainMap(payloadValue, "delta.payload")
          \treturn table.freeze({
          \t\tbaseSchemaVersion = canonicalRecipe.schemaVersion,
          \t\tbaseRegionId = canonicalRecipe.regionId,
          \t\tbaseFingerprint = canonicalRecipe.fingerprint,
          \t\tsequence = canonicalSequence,
          \t\tkind = canonicalKind,
          \t\ttargetKey = canonicalTarget,
          \t\tpayload = canonicalPayload,
          \t})
          end

          function ResolvedRegionRecipe.assertDeltaMatchesBase(
          \trecipe: ResolvedRegionRecipe,
          \tdelta: RegionDelta
          ): ()
          \tlocal canonicalRecipe = ResolvedRegionRecipe.deserialize(recipe :: any)
          \tassert(type(delta) == "table", "delta must be a table")
          \tassert(getmetatable(delta) == nil, "delta must not have a metatable")
          \tassert(delta.baseSchemaVersion == canonicalRecipe.schemaVersion, "delta base schema version mismatch")
          \tassert(delta.baseRegionId == canonicalRecipe.regionId, "delta base region mismatch")
          \tassert(delta.baseFingerprint == canonicalRecipe.fingerprint, "delta base fingerprint mismatch")
          end
          '''
          text = text[:start] + new_delta + text[end:]
          module.write_text(text)

          test = Path('tests/resolved_region_recipe.luau')
          text = test.read_text()
          first_require = 'local ResolvedRegionRecipe = require("../src/shared/Reality/ResolvedRegionRecipe")\n'
          if 'local StableId = require(' not in text:
              text = text.replace(
                  first_require,
                  first_require + 'local StableId = require("../src/shared/Core/StableId")\n\nlocal WORLD_ID = StableId.fromParts("world", { "shared-alpha" })\n',
                  1,
              )
          text = text.replace('worldId = "world:shared-alpha",', 'worldId = WORLD_ID,')
          text = text.replace(
              'expectEqual("lock defensively copies world identity", locked.worldId, "world:shared-alpha")',
              'expectEqual("lock defensively copies world identity", locked.worldId, WORLD_ID)',
          )

          content_marker = '\texpect("content changes alter recipe fingerprint", changedContent.fingerprint ~= locked.fingerprint)\n'
          transition_tests = '''

          \tlocal exactRepeat = ResolvedRegionRecipe.resolveFirstObservation(locked, baseInput())
          \texpectEqual("exact repeat preserves first observed fingerprint", exactRepeat.fingerprint, locked.fingerprint)

          \tlocal futureCandidateInput = baseInput()
          \tfutureCandidateInput.generatorVersions.reality = 2
          \tfutureCandidateInput.canonicalContentKeys[1] = "object:future-chair"
          \tlocal futureResolved = ResolvedRegionRecipe.resolveFirstObservation(locked, futureCandidateInput)
          \texpectEqual(
          \t\t"later generator/content candidate cannot rewrite observed truth",
          \t\tfutureResolved.fingerprint,
          \t\tlocked.fingerprint
          \t)
          \texpectEqual("later candidate cannot rewrite locked reality version", futureResolved.generatorVersions.reality, 1)

          \tlocal wrongSeedInput = baseInput()
          \twrongSeedInput.worldSeedRef = "seed-ref:different:v1"
          \tlocal wrongSeedAccepted = pcall(function()
          \t\tResolvedRegionRecipe.resolveFirstObservation(locked, wrongSeedInput)
          \tend)
          \texpectEqual("relock rejects a different world seed", wrongSeedAccepted, false)

          \tlocal wrongRegionInput = baseInput()
          \twrongRegionInput.regionAddress.x += 1
          \tlocal wrongRegionAccepted = pcall(function()
          \t\tResolvedRegionRecipe.resolveFirstObservation(locked, wrongRegionInput)
          \tend)
          \texpectEqual("relock rejects a different region", wrongRegionAccepted, false)
          '''
          if transition_tests.strip() not in text:
              if content_marker not in text:
                  raise SystemExit('transition test marker mismatch')
              text = text.replace(content_marker, content_marker + transition_tests, 1)

          invalid_marker = '\tlocal duplicateAnchorInput = baseInput()\n'
          invalid_world = '''\tlocal invalidWorldInput = baseInput()
          \tinvalidWorldInput.worldId = "world:shared-alpha"
          \tlocal invalidWorldAccepted = pcall(function()
          \t\tResolvedRegionRecipe.lockFirstObservation(invalidWorldInput)
          \tend)
          \texpectEqual("resolved truth requires canonical WorldId StableId", invalidWorldAccepted, false)

          '''
          if invalid_world not in text:
              if invalid_marker not in text:
                  raise SystemExit('invalid-world marker mismatch')
              text = text.replace(invalid_marker, invalid_world + invalid_marker, 1)

          text = text.replace('ResolvedRegionRecipe.newDelta(', 'ResolvedRegionRecipe.newDelta(locked, ')

          delta_line = '\tlocal delta = ResolvedRegionRecipe.newDelta(locked, 1, "mechanism-state", "door:service-a", deltaPayload)\n'
          delta_binding = '''\texpectEqual("delta binds exact base schema", delta.baseSchemaVersion, locked.schemaVersion)
          \texpectEqual("delta binds exact base region", delta.baseRegionId, locked.regionId)
          \texpectEqual("delta binds exact base fingerprint", delta.baseFingerprint, locked.fingerprint)
          \tlocal matchingBaseAccepted = pcall(function()
          \t\tResolvedRegionRecipe.assertDeltaMatchesBase(locked, delta)
          \tend)
          \texpectEqual("delta validates against its exact base", matchingBaseAccepted, true)
          \tlocal wrongBaseAccepted = pcall(function()
          \t\tResolvedRegionRecipe.assertDeltaMatchesBase(changedContent, delta)
          \tend)
          \texpectEqual("delta rejects replay onto a different recipe fingerprint", wrongBaseAccepted, false)
          '''
          if delta_binding not in text:
              if delta_line not in text:
                  raise SystemExit('delta binding marker mismatch')
              text = text.replace(delta_line, delta_line + delta_binding, 1)

          oversized_marker = '\tlocal cyclicPayload = {}\n'
          oversized_test = '''\tlocal oversizedStringAccepted = pcall(function()
          \t\tResolvedRegionRecipe.newDelta(locked, 2, "invalid-string-size", nil, {
          \t\t\tnote = string.rep("x", ResolvedRegionRecipe.MaxDeltaStringBytes + 1),
          \t\t})
          \tend)
          \texpectEqual("delta payload rejects oversized string values", oversizedStringAccepted, false)

          '''
          if oversized_test not in text:
              if oversized_marker not in text:
                  raise SystemExit('oversized-string marker mismatch')
              text = text.replace(oversized_marker, oversized_test + oversized_marker, 1)

          test.write_text(text)
          PY

      - name: Format source and tests
        run: stylua src tests

      - name: Commit repairs
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/Reality/ResolvedRegionRecipe.luau tests/resolved_region_recipe.luau
          git commit -m "fix(reality): enforce first-observation lock invariants"
          git push origin HEAD:agent/reality/9-resolved-region-lock-sol56g7
