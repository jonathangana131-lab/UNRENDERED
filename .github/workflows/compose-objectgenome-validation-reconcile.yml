name: Compose ObjectGenome validation reconciliation

on:
  push:
    branches:
      - agent/integration/6-objectgenome-validation-reconcile-sol56q4

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/integration/6-objectgenome-validation-reconcile-sol56q4
          fetch-depth: 0

      - name: Install pinned toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check

      - name: Reconcile exact-shape validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return source.replace(old, new, 1)

          core_path = Path("src/shared/Objects/ObjectGenome.luau")
          core = core_path.read_text()

          core = replace_once(
              core,
              '\tmaterialKey = true,\n\tmassKg = true,\n',
              '\tmaterialKey = true,\n\tmaterialRecipeVersion = true,\n\tmassKg = true,\n',
              "component material revision allowlist",
          )

          core = replace_once(
              core,
              '''local AFFORDANCE_FIELDS = {\n\tkey = true,\n\tkind = true,\n\tcomponentKey = true,\n\tlocalPointM = true,\n\tradiusM = true,\n}\n''',
              '''local AFFORDANCE_FIELDS = {\n\tkey = true,\n\tkind = true,\n\tcomponentKey = true,\n\tlocalPointM = true,\n\tradiusM = true,\n}\n\nlocal STATE_FIELDS = {\n\tstateSchemaVersion = true,\n\tgenomeId = true,\n\tcomponentWear = true,\n\tcomponentDamage = true,\n\tmechanismPosition = true,\n\tdetachedComponents = true,\n}\n''',
              "ObjectState allowlist",
          )

          core = replace_once(
              core,
              '''\tif type(value) ~= "table" then\n\t\treturn\n\tend\n\n\tfor key in pairs(value) do\n''',
              '''\tif type(value) ~= "table" then\n\t\treturn\n\tend\n\tif getmetatable(value) ~= nil then\n\t\taddIssue(issues, "schema.metatable", path, "canonical plain-data records must not have metatables")\n\t\treturn\n\tend\n\n\tfor key in pairs(value) do\n''',
              "record metatable rejection",
          )

          core = replace_once(
              core,
              '''\tif type(value) ~= "table" then\n\t\taddIssue(issues, "array.shape", path, "collection must be a dense 1-based array")\n\t\treturn false, 0\n\tend\n\n\tlocal numericKeyCount = 0\n''',
              '''\tif type(value) ~= "table" then\n\t\taddIssue(issues, "array.shape", path, "collection must be a dense 1-based array")\n\t\treturn false, 0\n\tend\n\tif getmetatable(value) ~= nil then\n\t\taddIssue(issues, "schema.metatable", path, "canonical plain-data arrays must not have metatables")\n\t\treturn false, 0\n\tend\n\n\tlocal numericKeyCount = 0\n''',
              "array metatable rejection",
          )

          core = replace_once(
              core,
              '''\tif type(value) ~= "table" then\n\t\taddIssue(issues, "genome.type", "$", "ObjectGenome must be a plain table")\n\t\treturn reportResult(issues)\n\tend\n\n\tvalidateGenomeShape(issues, value)\n''',
              '''\tif type(value) ~= "table" then\n\t\taddIssue(issues, "genome.type", "$", "ObjectGenome must be a plain table")\n\t\treturn reportResult(issues)\n\tend\n\tif getmetatable(value) ~= nil then\n\t\taddIssue(issues, "schema.metatable", "$", "ObjectGenome must be a plain table without a metatable")\n\t\treturn reportResult(issues)\n\tend\n\n\tvalidateGenomeShape(issues, value)\n''',
              "root genome metatable rejection",
          )

          core = replace_once(
              core,
              '''\tif type(state) ~= "table" then\n\t\taddIssue(issues, "state.type", "$", "ObjectState must be a plain table")\n\t\treturn reportResult(issues)\n\tend\n\tif state.stateSchemaVersion ~= ObjectGenome.STATE_SCHEMA_VERSION then\n''',
              '''\tif type(state) ~= "table" then\n\t\taddIssue(issues, "state.type", "$", "ObjectState must be a plain table")\n\t\treturn reportResult(issues)\n\tend\n\tif getmetatable(state) ~= nil then\n\t\taddIssue(issues, "state.metatable", "$", "ObjectState must be a plain table without a metatable")\n\t\treturn reportResult(issues)\n\tend\n\tvalidateRecordShape(issues, "$state", state, STATE_FIELDS)\n\tif state.stateSchemaVersion ~= ObjectGenome.STATE_SCHEMA_VERSION then\n''',
              "ObjectState root shape",
          )

          core = replace_once(
              core,
              '''\t\tif type(mapValue) ~= "table" then\n\t\t\taddIssue(issues, "state.collection", fieldName, `{fieldName} must be a table`)\n\t\t\treturn\n\t\tend\n\t\tfor key in pairs(knownKeys) do\n''',
              '''\t\tif type(mapValue) ~= "table" then\n\t\t\taddIssue(issues, "state.collection", fieldName, `{fieldName} must be a table`)\n\t\t\treturn\n\t\tend\n\t\tif getmetatable(mapValue) ~= nil then\n\t\t\taddIssue(issues, "state.metatable", fieldName, `{fieldName} must not have a metatable`)\n\t\t\treturn\n\t\tend\n\t\tfor key in pairs(knownKeys) do\n''',
              "ObjectState unit-map metatable rejection",
          )

          core = replace_once(
              core,
              '''\tif type(state.detachedComponents) ~= "table" then\n\t\taddIssue(issues, "state.collection", "detachedComponents", "detachedComponents must be a table")\n\telse\n\t\tfor key in pairs(componentKeys) do\n''',
              '''\tif type(state.detachedComponents) ~= "table" then\n\t\taddIssue(issues, "state.collection", "detachedComponents", "detachedComponents must be a table")\n\telseif getmetatable(state.detachedComponents) ~= nil then\n\t\taddIssue(issues, "state.metatable", "detachedComponents", "detachedComponents must not have a metatable")\n\telse\n\t\tfor key in pairs(componentKeys) do\n''',
              "detached map metatable rejection",
          )

          core_path.write_text(core)

          test_path = Path("tests/object_genome_contract_lock.luau")
          test = test_path.read_text()
          test = replace_once(
              test,
              '''\texpect(\n\t\t"rejects undeclared affordance fields",\n\t\thasCode(ObjectGenome.inspect(unknownAffordanceField), "schema.unknown_field")\n\t)\n\n\tlocal sparseComponents = deepCopy(Fixtures.officeChair)\n''',
              '''\texpect(\n\t\t"rejects undeclared affordance fields",\n\t\thasCode(ObjectGenome.inspect(unknownAffordanceField), "schema.unknown_field")\n\t)\n\n\tlocal metatableRootGenome = deepCopy(Fixtures.officeChair)\n\tsetmetatable(metatableRootGenome, {})\n\texpect(\n\t\t"semantic validator rejects metatable-backed genome root",\n\t\thasCode(ObjectGenome.inspect(metatableRootGenome), "schema.metatable")\n\t)\n\n\tlocal metatableNestedGenome = deepCopy(Fixtures.officeChair)\n\tsetmetatable(metatableNestedGenome.provenance, {})\n\texpect(\n\t\t"semantic validator rejects metatable-backed nested records",\n\t\thasCode(ObjectGenome.inspect(metatableNestedGenome), "schema.metatable")\n\t)\n\n\tlocal sparseComponents = deepCopy(Fixtures.officeChair)\n''',
              "genome metatable regressions",
          )

          test = replace_once(
              test,
              '''\tlocal missingGenomeIdState = ObjectGenome.defaultState(Fixtures.officeChair)\n''',
              '''\tlocal stateWithUnknownField = ObjectGenome.defaultState(Fixtures.officeChair)\n\tstateWithUnknownField.debugRuntime = true\n\texpect(\n\t\t"rejects undeclared ObjectState top-level fields",\n\t\thasCode(ObjectGenome.inspectState(Fixtures.officeChair, stateWithUnknownField), "schema.unknown_field")\n\t)\n\n\tlocal metatableState = ObjectGenome.defaultState(Fixtures.officeChair)\n\tsetmetatable(metatableState, {})\n\texpect(\n\t\t"rejects metatable-backed ObjectState root",\n\t\thasCode(ObjectGenome.inspectState(Fixtures.officeChair, metatableState), "state.metatable")\n\t)\n\n\tlocal metatableStateMap = ObjectGenome.defaultState(Fixtures.officeChair)\n\tsetmetatable(metatableStateMap.componentWear, {})\n\texpect(\n\t\t"rejects metatable-backed ObjectState maps",\n\t\thasCode(ObjectGenome.inspectState(Fixtures.officeChair, metatableStateMap), "state.metatable")\n\t)\n\n\tlocal missingGenomeIdState = ObjectGenome.defaultState(Fixtures.officeChair)\n''',
              "ObjectState shape/metatable regressions",
          )
          test_path.write_text(test)
          PY

          stylua src/shared/Objects/ObjectGenome.luau tests/object_genome_contract_lock.luau
          selene src/shared/Objects/ObjectGenome.luau tests/object_genome_contract_lock.luau
          lune run tests/run.luau

      - name: Commit reconciled validation boundary
        shell: bash
        run: |
          rm .github/workflows/compose-objectgenome-validation-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden ObjectGenome validation boundary"
          git push origin HEAD:agent/integration/6-objectgenome-validation-reconcile-sol56q4
