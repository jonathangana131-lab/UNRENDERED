name: MaterialDNA 74 Current Main Compose

on:
  push:
    branches: [agent/integration/74-materialdna-currentmain-7b2e]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false

      - name: Import reviewed #74 contract delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/materials/74-materialdna-exact-revision-sol56x7
          git restore --source=origin/agent/materials/74-materialdna-exact-revision-sol56x7 -- \
            Docs/MATERIAL_DNA_CONTRACT.md \
            src/shared/Materials/MaterialDNA.luau \
            src/shared/Materials/MaterialFixtureCatalog.luau \
            tests/materialdna_contract.luau

      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check
          rokit list

      - name: Generate Rojo sourcemap
        run: rojo sourcemap default.project.json --output sourcemap.json

      - name: Download pinned Roblox type definitions
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.69.0/scripts/globalTypes.d.luau \
            -o globalTypes.d.luau

      - name: Format check
        run: stylua --check src tests

      - name: Lint
        run: selene src tests

      - name: Luau analysis
        run: luau-lsp analyze --platform=roblox --definitions:@roblox=globalTypes.d.luau --sourcemap=sourcemap.json src

      - name: Canonical randomness audit
        run: |
          python3 scripts/check_canonical_randomness.py --self-test
          python3 scripts/check_canonical_randomness.py

      - name: Shared-domain boundary audit
        run: |
          python3 scripts/check_domain_boundaries.py --self-test
          python3 scripts/check_domain_boundaries.py

      - name: Pure Luau tests
        run: lune run tests/run

      - name: Build place file
        run: |
          mkdir -p build
          rojo build default.project.json --output build/UNRENDERED.rbxlx

      - name: Publish clean four-file integration head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialdna-74-compose.yml
          git add \
            Docs/MATERIAL_DNA_CONTRACT.md \
            src/shared/Materials/MaterialDNA.luau \
            src/shared/Materials/MaterialFixtureCatalog.luau \
            tests/materialdna_contract.luau
          git commit -m "fix: lock exact MaterialDNA recipe revisions"
          git push origin HEAD:agent/integration/74-materialdna-currentmain-7b2e
