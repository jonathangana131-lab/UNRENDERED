name: Format mechanism-state repair

on:
  push:
    branches:
      - agent/objects/101-mechanism-state-sol56j9

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/objects/101-mechanism-state-sol56j9
          fetch-depth: 0

      - name: Install pinned toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Format changed Luau
        run: stylua src/shared/Objects/ObjectGenome.luau tests/object_genome.luau

      - name: Remove one-shot formatter
        run: rm .github/workflows/format-mechanism-state-repair.yml

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format ObjectGenome mechanism state repair"
          git push origin HEAD:agent/objects/101-mechanism-state-sol56j9
