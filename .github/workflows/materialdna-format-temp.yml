name: MaterialDNA temporary formatter

on:
  push:
    branches: [agent/materials/5-strict-fixtures-solc7e1]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check
      - name: Format touched Luau files
        run: |
          stylua src/shared/Materials/MaterialDNA.luau \
            src/shared/Materials/MaterialFixtureData.luau \
            src/shared/Materials/MaterialFixtures.luau \
            tests/materialdna_contract.luau
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/Materials/MaterialDNA.luau \
            src/shared/Materials/MaterialFixtureData.luau \
            src/shared/Materials/MaterialFixtures.luau \
            tests/materialdna_contract.luau
          git commit -m "style: apply pinned StyLua"
          git push origin HEAD:agent/materials/5-strict-fixtures-solc7e1
