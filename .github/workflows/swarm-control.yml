name: Swarm Control Plane

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [swarm-control]
    paths: ['.swarm/**', '.github/workflows/swarm-control.yml']
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-tests:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Deterministic and adversarial control-plane tests
        run: |
          python3 tools/swarm/test_swarmctl.py
          python3 tools/swarm/test_swarmctl_hardening.py
          python3 tools/swarm/swarmctl.py simulate --workers 30
          python3 tools/swarm/swarmctl_hardening.py simulate --workers 30

  pr-ownership:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch trusted base and live control branch
        run: |
          git fetch origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          git fetch origin swarm-control:refs/remotes/origin/swarm-control
      - name: Materialize authoritative control state
        run: |
          mkdir -p "$RUNNER_TEMP/swarm-state"
          git archive origin/swarm-control .swarm | tar -x -C "$RUNNER_TEMP/swarm-state"
      - name: Materialize trusted base validator
        id: trusted-validator
        run: |
          mkdir -p "$RUNNER_TEMP/trusted-swarm"
          git show "origin/${GITHUB_BASE_REF}:tools/swarm/swarmctl.py" > "$RUNNER_TEMP/trusted-swarm/swarmctl.py"
          if git cat-file -e "origin/${GITHUB_BASE_REF}:tools/swarm/swarmctl_hardening.py" 2>/dev/null; then
            git show "origin/${GITHUB_BASE_REF}:tools/swarm/swarmctl_hardening.py" > "$RUNNER_TEMP/trusted-swarm/swarmctl_hardening.py"
            if git cat-file -e "origin/${GITHUB_BASE_REF}:tools/swarm/swarmctl_hardening_base.py" 2>/dev/null; then
              git show "origin/${GITHUB_BASE_REF}:tools/swarm/swarmctl_hardening_base.py" > "$RUNNER_TEMP/trusted-swarm/swarmctl_hardening_base.py"
            fi
            python3 -m py_compile "$RUNNER_TEMP/trusted-swarm/"*.py
            PYTHONPATH="$RUNNER_TEMP/trusted-swarm" python3 -c 'import swarmctl_hardening'
            echo "engine=hardening" >> "$GITHUB_OUTPUT"
          else
            # This one upgrade generation remains policed by the already-trusted
            # V2 validator. Once merged, all later PRs use hardened base code.
            python3 -m py_compile "$RUNNER_TEMP/trusted-swarm/swarmctl.py"
            echo "engine=bootstrap" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect changed files safely
        run: git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > "$RUNNER_TEMP/swarm-changed-files.txt"
      - name: Enforce live ownership with trusted code
        run: |
          if [[ "${{ steps.trusted-validator.outputs.engine }}" == "hardening" ]]; then
            python3 "$RUNNER_TEMP/trusted-swarm/swarmctl_hardening.py" pr-check \
              --root "$RUNNER_TEMP/swarm-state/.swarm" --event "$GITHUB_EVENT_PATH" \
              --changed-files "$RUNNER_TEMP/swarm-changed-files.txt"
          else
            python3 "$RUNNER_TEMP/trusted-swarm/swarmctl.py" pr-check \
              --root "$RUNNER_TEMP/swarm-state/.swarm" --event "$GITHUB_EVENT_PATH" \
              --changed-files "$RUNNER_TEMP/swarm-changed-files.txt"
          fi

  validate-control-branch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/swarm-control' && !contains(github.event.head_commit.message, '[swarm-generated]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Materialize current and previous control snapshots
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          git fetch origin swarm-control:refs/remotes/origin/swarm-control
          git cat-file -e "${AFTER_SHA}^{commit}"
          echo "CONTROL_SHA=$AFTER_SHA" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/control-after" "$RUNNER_TEMP/control-before"
          git archive "$AFTER_SHA" .swarm | tar -x -C "$RUNNER_TEMP/control-after"
          if [[ -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            if git ls-tree -d --name-only "$BEFORE_SHA" .swarm | grep -qx '.swarm'; then
              git archive "$BEFORE_SHA" .swarm | tar -x -C "$RUNNER_TEMP/control-before"
              echo "before_available=true" >> "$GITHUB_ENV"
            fi
          fi
      - name: Validate state and ownership model
        run: |
          python3 tools/swarm/test_swarmctl.py
          python3 tools/swarm/test_swarmctl_hardening.py
          python3 tools/swarm/swarmctl_hardening.py validate --root "$RUNNER_TEMP/control-after/.swarm"
          python3 tools/swarm/swarmctl_hardening.py simulate --workers 30
      - name: Validate lease and immutable-event transitions
        if: env.before_available == 'true'
        run: |
          python3 tools/swarm/swarmctl_hardening.py transition-check \
            --before-root "$RUNNER_TEMP/control-before/.swarm" \
            --after-root "$RUNNER_TEMP/control-after/.swarm"
      - name: Rebuild board, metrics, and validation fence
        run: python3 tools/swarm/swarmctl_hardening.py render --root "$RUNNER_TEMP/control-after/.swarm"
      - name: Publish generated projection with bounded validated catch-up
        run: |
          set -euo pipefail
          EXPECTED="${CONTROL_SHA:?validated control snapshot SHA missing}"
          SNAPSHOT="$RUNNER_TEMP/control-after"
          MAX_PUBLISH_ATTEMPTS=12

          prepare_latest_projection() {
            local sha="$1"
            local parent=""
            local next_root="$RUNNER_TEMP/control-catchup"
            local parent_root="$RUNNER_TEMP/control-catchup-before"
            rm -rf "$next_root" "$parent_root"
            mkdir -p "$next_root" "$parent_root"
            git archive "$sha" .swarm | tar -x -C "$next_root"
            python3 tools/swarm/swarmctl_hardening.py validate --root "$next_root/.swarm"
            parent="$(git rev-parse "${sha}^" 2>/dev/null || true)"
            if [[ -n "$parent" ]] && git ls-tree -d --name-only "$parent" .swarm | grep -qx '.swarm'; then
              git archive "$parent" .swarm | tar -x -C "$parent_root"
              python3 tools/swarm/swarmctl_hardening.py transition-check \
                --before-root "$parent_root/.swarm" --after-root "$next_root/.swarm"
            fi
            python3 tools/swarm/swarmctl_hardening.py render --root "$next_root/.swarm"
            SNAPSHOT="$next_root"
          }

          git config user.name unrendered-swarm-control
          git config user.email actions@users.noreply.github.com
          for attempt in $(seq 1 "$MAX_PUBLISH_ATTEMPTS"); do
            git fetch origin swarm-control:refs/remotes/origin/swarm-control
            LATEST="$(git rev-parse origin/swarm-control)"
            if [[ "$LATEST" != "$EXPECTED" ]]; then
              echo "Control advanced to $LATEST; validating newest snapshot before retry $attempt/$MAX_PUBLISH_ATTEMPTS."
              EXPECTED="$LATEST"
              prepare_latest_projection "$EXPECTED"
            fi

            git switch --detach "$EXPECTED"
            mkdir -p .swarm/generated
            rm -rf .swarm/generated/*
            cp -R "$SNAPSHOT/.swarm/generated/." .swarm/generated/
            [[ -n "$(git status --porcelain -- .swarm/generated)" ]] || exit 0
            git add .swarm/generated
            git commit -m 'chore(swarm): publish validated control projection [swarm-generated]'

            git fetch origin swarm-control:refs/remotes/origin/swarm-control
            if [[ "$(git rev-parse origin/swarm-control)" != "$EXPECTED" ]]; then
              echo "Control advanced during projection publish; retrying from authoritative tip."
              continue
            fi
            if git push origin HEAD:swarm-control; then
              exit 0
            fi
            echo "Projection push lost a final CAS race; retrying from authoritative tip."
          done
          echo "Control kept advancing after $MAX_PUBLISH_ATTEMPTS validated projection attempts; failing closed."
          exit 1

  sync-main-health:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Publish canonical CI health with bounded validated catch-up
        env:
          MAIN_SHA: ${{ github.event.workflow_run.head_sha }}
          MAIN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          MAIN_RUN_ID: ${{ github.event.workflow_run.id }}
          MAIN_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          MAX_PUBLISH_ATTEMPTS=12
          git config user.name unrendered-swarm-health
          git config user.email actions@users.noreply.github.com

          for attempt in $(seq 1 "$MAX_PUBLISH_ATTEMPTS"); do
            git fetch origin swarm-control:refs/remotes/origin/swarm-control
            CONTROL_SHA="$(git rev-parse origin/swarm-control)"
            EXPECTED="${CONTROL_SHA:?materialized control snapshot SHA missing}"
            rm -rf "$RUNNER_TEMP/control-health"
            mkdir -p "$RUNNER_TEMP/control-health"
            git archive "$CONTROL_SHA" .swarm | tar -x -C "$RUNNER_TEMP/control-health"

            CURRENT_RUN_ID="$(python3 -c 'import json, pathlib, sys; p = pathlib.Path(sys.argv[1]); print(json.loads(p.read_text(encoding="utf-8")).get("workflowRunId", 0) if p.exists() else 0)' "$RUNNER_TEMP/control-health/.swarm/health/main.json")"
            if (( CURRENT_RUN_ID >= MAIN_RUN_ID )); then
              echo "Canonical health run $MAIN_RUN_ID is already represented or superseded by run $CURRENT_RUN_ID."
              exit 0
            fi

            if ! python3 tools/swarm/swarmctl_hardening.py sync-main-health \
              --root "$RUNNER_TEMP/control-health/.swarm" --sha "$MAIN_SHA" \
              --conclusion "$MAIN_CONCLUSION" --run-id "$MAIN_RUN_ID" --updated-at "$MAIN_UPDATED_AT"; then
              echo "Control snapshot $CONTROL_SHA could not accept canonical health; retrying from a newer tip."
              sleep 1
              continue
            fi
            if ! python3 tools/swarm/swarmctl_hardening.py validate --root "$RUNNER_TEMP/control-health/.swarm"; then
              echo "Control snapshot $CONTROL_SHA is not structurally valid after health sync; retrying from a newer tip."
              sleep 1
              continue
            fi
            python3 tools/swarm/swarmctl_hardening.py render --root "$RUNNER_TEMP/control-health/.swarm"

            git switch --detach "$EXPECTED"
            mkdir -p .swarm/health .swarm/generated
            cp "$RUNNER_TEMP/control-health/.swarm/health/main.json" .swarm/health/main.json
            cp "$RUNNER_TEMP/control-health/.swarm/lanes/OPS-MAIN-HEALTH.json" .swarm/lanes/OPS-MAIN-HEALTH.json
            rm -rf .swarm/generated/*
            cp -R "$RUNNER_TEMP/control-health/.swarm/generated/." .swarm/generated/
            [[ -n "$(git status --porcelain -- .swarm/health/main.json .swarm/lanes/OPS-MAIN-HEALTH.json .swarm/generated)" ]] || exit 0
            git add .swarm/health/main.json .swarm/lanes/OPS-MAIN-HEALTH.json .swarm/generated
            git commit -m 'chore(swarm): sync canonical main CI health and validation fence [swarm-generated]'

            git fetch origin swarm-control:refs/remotes/origin/swarm-control
            if [[ "$(git rev-parse origin/swarm-control)" != "$EXPECTED" ]]; then
              echo "Control advanced during health publish; retrying health against authoritative tip."
              continue
            fi
            if git push origin HEAD:swarm-control; then
              exit 0
            fi
            echo "Health push lost a final CAS race; retrying from authoritative tip."
          done
          echo "Control kept advancing or stayed invalid after $MAX_PUBLISH_ATTEMPTS health attempts; failing closed."
          exit 1
