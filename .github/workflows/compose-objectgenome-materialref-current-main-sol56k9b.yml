name: Compose ObjectGenome MaterialRef Current Main

on:
  push:
    branches:
      - agent/scratch/100-materialref-current-main-sol56k9b

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/scratch/100-materialref-current-main-sol56k9b
          fetch-depth: 0

      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check

      - name: Compose exact MaterialDNA boundary without disturbing landed fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one marker, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/shared/Objects/ObjectGenome.luau",
              'local StableId = require(script.Parent.Parent.Core.StableId)\n',
              'local StableId = require(script.Parent.Parent.Core.StableId)\nlocal MaterialDNA = require(script.Parent.Parent.Materials.MaterialDNA)\n',
          )

          replace_once(
              "src/shared/Objects/ObjectGenome.luau",
              '''\t\tif not isSemanticKey(component.materialKey) then\n\t\t\taddIssue(\n\t\t\t\tissues,\n\t\t\t\t"component.material_key",\n\t\t\t\tpath .. ".materialKey",\n\t\t\t\t"materialKey must be the stable lowercase MaterialDNA recipe id"\n\t\t\t)\n\t\tend\n\t\tif not isPositiveInteger(component.materialRecipeVersion) then\n\t\t\taddIssue(\n\t\t\t\tissues,\n\t\t\t\t"component.material_recipe_version",\n\t\t\t\tpath .. ".materialRecipeVersion",\n\t\t\t\t"materialRecipeVersion must be a positive integer"\n\t\t\t)\n\t\tend\n''',
              '''\t\tlocal materialKeyValidation = MaterialDNA.validateReference({\n\t\t\tid = component.materialKey,\n\t\t\trecipeVersion = 1,\n\t\t})\n\t\tif not materialKeyValidation.ok then\n\t\t\taddIssue(\n\t\t\t\tissues,\n\t\t\t\t"component.material_key",\n\t\t\t\tpath .. ".materialKey",\n\t\t\t\t"materialKey must satisfy MaterialDNA v2 project id rules"\n\t\t\t)\n\t\tend\n\t\tlocal materialRecipeVersionValidation = MaterialDNA.validateReference({\n\t\t\tid = "material.v1.object-genome-validation-probe",\n\t\t\trecipeVersion = component.materialRecipeVersion,\n\t\t})\n\t\tif not materialRecipeVersionValidation.ok then\n\t\t\taddIssue(\n\t\t\t\tissues,\n\t\t\t\t"component.material_recipe_version",\n\t\t\t\tpath .. ".materialRecipeVersion",\n\t\t\t\t"materialRecipeVersion must satisfy MaterialDNA v2 recipe revision rules"\n\t\t\t)\n\t\tend\n''',
          )

          replace_once(
              "src/shared/Objects/ObjectGenome.luau",
              '''function ObjectGenome.identityParts(value: ObjectGenome): { string }\n\treturn {\n\t\ttostring(value.schemaVersion),\n\t\tvalue.familyId,\n\t\ttostring(value.familyVersion),\n\t\tvalue.variantKey,\n\t}\nend\n''',
              '''local function materialIdentitySignature(value: ObjectGenome): string\n\t-- MaterialDNA recipe revisions are independent content versions. Fold the ordered\n\t-- exact references into identity so a material retarget cannot preserve genomeId\n\t-- even if an author forgets to advance the broader familyVersion.\n\tlocal signature = StableId.fromParts("object-genome-materials", { "v1", "empty" })\n\tfor index, component in ipairs(value.components) do\n\t\tsignature = StableId.fromParts("object-genome-materials", {\n\t\t\tsignature,\n\t\t\ttostring(index),\n\t\t\tcomponent.materialKey,\n\t\t\ttostring(component.materialRecipeVersion),\n\t\t})\n\tend\n\treturn signature\nend\n\nfunction ObjectGenome.identityParts(value: ObjectGenome): { string }\n\treturn {\n\t\ttostring(value.schemaVersion),\n\t\tvalue.familyId,\n\t\ttostring(value.familyVersion),\n\t\tvalue.variantKey,\n\t\tmaterialIdentitySignature(value),\n\t}\nend\n''',
          )

          replace_once(
              "Docs/OBJECT_GENOME.md",
              '- `familyId + familyVersion + variantKey + schemaVersion` form the stable genome identity input. `ObjectGenome.identityParts()` supplies those semantic parts to the locked project `StableId` contract; ObjectGenome does not duplicate hashing/canonical encoding.\n',
              '- `familyId + familyVersion + variantKey + schemaVersion` form the stable semantic family/version identity, and `ObjectGenome.identityParts()` also includes a deterministic signature of every component\'s ordered exact MaterialDNA reference. The locked project `StableId` contract performs hashing/canonical encoding. This makes a material recipe retarget mechanically change `genomeId` even if a producer forgets to advance `familyVersion`.\n',
          )
          replace_once(
              "Docs/OBJECT_GENOME.md",
              '- Each component pins an exact MaterialDNA recipe revision as `(materialKey, materialRecipeVersion)`: `materialKey` is the stable lowercase MaterialDNA recipe id and `materialRecipeVersion` is its positive content revision. ObjectGenome validates and owns those plain values but does not import MaterialDNA implementation details or Roblox asset IDs. A published component material-revision change is a canonical object recipe change and therefore requires the corresponding `familyVersion` to advance rather than silently retargeting an established genome identity.\n',
              '- Each component pins an exact MaterialDNA recipe revision as `(materialKey, materialRecipeVersion)`. ObjectGenome keeps those values flat in its own schema, but validates the pair against production `MaterialDNA.validateReference()` semantics while preserving its stable field-specific diagnostics. ObjectGenome therefore accepts exactly the same MaterialDNA id/version domain instead of maintaining a drifting duplicate validator. Exact ordered material references also participate mechanically in ObjectGenome StableId. Advancing `familyVersion` remains the authored family-recipe evolution rule, but identity safety does not rely on that human discipline.\n',
          )
          replace_once(
              "Docs/OBJECT_GENOME.md",
              'Changing field meaning or deterministic identity inputs requires an object schema/version decision. Changing published canonical recipe content such as a component\'s exact material revision requires advancing `familyVersion`. Extend mechanism/affordance vocabularies through this contract rather than embedding furniture-specific runtime state into unrelated systems.\n',
              'Changing field meaning or deterministic identity inputs requires an object schema/version decision. Published authored recipe changes still advance `familyVersion`; independently versioned exact MaterialDNA revisions additionally participate directly in `genomeId`, so a material retarget can never preserve the prior state identity. Extend mechanism/affordance vocabularies through this contract rather than embedding furniture-specific runtime state into unrelated systems.\n',
          )

          replace_once(
              "tests/object_genome.luau",
              'local StableId = ProductionLoader.requireShared("Core/StableId")\nlocal ObjectGenome = ProductionLoader.requireShared("Objects/ObjectGenome")\n',
              'local StableId = ProductionLoader.requireShared("Core/StableId")\nlocal MaterialDNA = ProductionLoader.requireShared("Materials/MaterialDNA")\nlocal ObjectGenome = ProductionLoader.requireShared("Objects/ObjectGenome")\n',
          )
          replace_once(
              "tests/object_genome.luau",
              '''\t\tfor _, component in ipairs(fixture.genome.components) do\n\t\t\texpect(\n\t\t\t\tfixture.name .. " component uses MaterialDNA-style project key",\n\t\t\t\tstring.match(component.materialKey, "^material%.v1%.") ~= nil\n\t\t\t)\n\t\t\texpect(\n\t\t\t\tfixture.name .. " component pins a material recipe revision",\n\t\t\t\tcomponent.materialRecipeVersion == 1\n\t\t\t)\n\t\tend\n''',
              '''\t\tfor _, component in ipairs(fixture.genome.components) do\n\t\t\texpect(\n\t\t\t\tfixture.name .. " component uses MaterialDNA-style project key",\n\t\t\t\tstring.match(component.materialKey, "^material%.v1%.") ~= nil\n\t\t\t)\n\t\t\texpect(\n\t\t\t\tfixture.name .. " component pins a material recipe revision",\n\t\t\t\tcomponent.materialRecipeVersion == 1\n\t\t\t)\n\t\t\texpect(\n\t\t\t\tfixture.name .. " component reference satisfies production MaterialDNA",\n\t\t\t\tMaterialDNA.validateReference({\n\t\t\t\t\tid = component.materialKey,\n\t\t\t\t\trecipeVersion = component.materialRecipeVersion,\n\t\t\t\t}).ok\n\t\t\t)\n\t\tend\n''',
          )
          replace_once(
              "tests/object_genome.luau",
              '''\texpect(\n\t\t"material recipe revision is retained as canonical object recipe input",\n\t\trevisedShell ~= nil\n\t\t\tand canonicalShell ~= nil\n\t\t\tand revisedShell.materialKey == canonicalShell.materialKey\n\t\t\tand revisedShell.materialRecipeVersion ~= canonicalShell.materialRecipeVersion\n\t\t\tand ObjectGenome.inspect(revisedMaterial).ok\n\t)\n''',
              '''\texpect(\n\t\t"material recipe revision is retained as canonical object recipe input",\n\t\trevisedShell ~= nil\n\t\t\tand canonicalShell ~= nil\n\t\t\tand revisedShell.materialKey == canonicalShell.materialKey\n\t\t\tand revisedShell.materialRecipeVersion ~= canonicalShell.materialRecipeVersion\n\t\t\tand ObjectGenome.inspect(revisedMaterial).ok\n\t)\n\texpect(\n\t\t"material recipe revision mechanically changes canonical genome identity",\n\t\tObjectGenome.identityKey(revisedMaterial) ~= ObjectGenome.identityKey(Fixtures.filingCabinet)\n\t)\n\n\tlocal publishedMaterialRevision = deepCopy(Fixtures.filingCabinet)\n\tlocal publishedShell = findComponent(publishedMaterialRevision, "shell")\n\tpublishedMaterialRevision.familyVersion += 1\n\tif publishedShell ~= nil then\n\t\tpublishedShell.materialRecipeVersion += 1\n\tend\n\texpect(\n\t\t"published material revision with familyVersion advance is valid and changes identity",\n\t\tpublishedShell ~= nil\n\t\t\tand ObjectGenome.inspect(publishedMaterialRevision).ok\n\t\t\tand ObjectGenome.identityKey(publishedMaterialRevision)\n\t\t\t\t~= ObjectGenome.identityKey(Fixtures.filingCabinet)\n\t)\n\n\tlocal materialBoundaryCases = {\n\t\t{ name = "slash id", id = "material.v1/reference-probe", recipeVersion = 1 },\n\t\t{ name = "numeric-only id", id = "123", recipeVersion = 1 },\n\t\t{ name = "overlong id", id = "material.v1." .. string.rep("a", 151), recipeVersion = 1 },\n\t\t{ name = "max recipe version", id = "material.v1.reference-probe", recipeVersion = 2147483647 },\n\t\t{ name = "above max recipe version", id = "material.v1.reference-probe", recipeVersion = 2147483648 },\n\t}\n\tfor _, materialCase in ipairs(materialBoundaryCases) do\n\t\tlocal reference = {\n\t\t\tid = materialCase.id,\n\t\t\trecipeVersion = materialCase.recipeVersion,\n\t\t}\n\t\tlocal expectedReferenceValidity = MaterialDNA.validateReference(reference).ok\n\t\tlocal boundaryGenome = deepCopy(Fixtures.officeChair)\n\t\tboundaryGenome.components[1].materialKey = reference.id\n\t\tboundaryGenome.components[1].materialRecipeVersion = reference.recipeVersion\n\t\texpect(\n\t\t\t"ObjectGenome matches MaterialDNA reference boundary: " .. materialCase.name,\n\t\t\tObjectGenome.inspect(boundaryGenome).ok == expectedReferenceValidity\n\t\t)\n\tend\n''',
          )
          PY

          stylua src tests

          cat > tests/.print_objectgenome_ids.luau <<'LUA'
          local ProductionLoader = require("./support/ProductionLoader")
          local ObjectGenome = ProductionLoader.requireShared("Objects/ObjectGenome")
          local Fixtures = ProductionLoader.requireShared("Objects/ObjectGenomeFixtures")

          print(ObjectGenome.identityKey(Fixtures.officeChair))
          print(ObjectGenome.identityKey(Fixtures.officeTable))
          print(ObjectGenome.identityKey(Fixtures.filingCabinet))
          LUA

          python3 <<'PY'
          from pathlib import Path
          import subprocess

          output = subprocess.check_output(["lune", "run", "tests/.print_objectgenome_ids"], text=True)
          ids = [line.strip() for line in output.splitlines() if line.strip().startswith("object-genome:v1:")]
          if len(ids) != 3:
              raise SystemExit(f"expected three ObjectGenome ids, got {ids!r}\n{output}")
          path = Path("tests/object_genome.luau")
          text = path.read_text()
          old_ids = [
              "object-genome:v1:51c5fd2813c6dfc8b3e089570b0632af",
              "object-genome:v1:44d2ee4894de4c20184e7e2a91c876e4",
              "object-genome:v1:7bd8b9e0c82d36ae53374a390fe2f969",
          ]
          for old, new in zip(old_ids, ids):
              if text.count(old) != 1:
                  raise SystemExit(f"expected one golden id marker for {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          rm tests/.print_objectgenome_ids.luau
          stylua src tests
          stylua --check src tests
          selene src tests
          lune run tests/run

      - name: Commit composed blobs and retire helper
        shell: bash
        run: |
          git rm .github/workflows/compose-objectgenome-materialref-current-main-sol56k9b.yml
          git add Docs/OBJECT_GENOME.md src/shared/Objects/ObjectGenome.luau tests/object_genome.luau
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(objects): compose exact MaterialDNA boundary on current main"
          git push origin HEAD:agent/scratch/100-materialref-current-main-sol56k9b
