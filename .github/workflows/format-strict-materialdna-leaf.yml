name: Format strict MaterialDNA leaf

on:
  push:
    branches:
      - agent/integration/5-materialdna-strict-v1-sol56j4r1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check
      - name: Format changed Lua files
        shell: bash
        run: |
          stylua src/shared/Materials/MaterialDNA.luau tests/materialdna_contract.luau
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/Materials/MaterialDNA.luau tests/materialdna_contract.luau
          git commit -m "Format strict MaterialDNA leaf"
          git push
