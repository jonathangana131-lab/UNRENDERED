name: MaterialDNA Luau Diagnostic One-Shot

on:
  push:
    branches:
      - agent/materials/5-v1-exact-shape-sol7c3e

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check
      - name: Prepare analysis inputs
        shell: bash
        run: |
          rojo sourcemap default.project.json --output sourcemap.json
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.69.0/scripts/globalTypes.d.luau \
            -o globalTypes.d.luau
      - name: Capture Luau analysis
        shell: bash
        run: |
          set +e
          luau-lsp analyze --platform=roblox --definitions:@roblox=globalTypes.d.luau --sourcemap=sourcemap.json src > materialdna-luau-diagnostic.txt 2>&1
          echo "exit_code=$?" >> materialdna-luau-diagnostic.txt
          exit 0
      - name: Publish diagnostic and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/materialdna-luau-diagnostic-once.yml
          git add materialdna-luau-diagnostic.txt
          git config user.name "unrendered-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: capture MaterialDNA Luau diagnostic"
          git push
