name: Issue 71 State Patch

on:
  push:
    branches: [agent/reality/71-new-state-boundary-56q9]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Patch remaining plain-data boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/shared/Reality/WorldEntity.luau')
          text = path.read_text()

          replacements = [
              (
                  '''local ORIGIN_KEYS: { [string]: boolean } = table.freeze({''',
                  '''local NEW_ENTITY_KEYS: { [string]: boolean } = table.freeze({\n\tid = true,\n\tkind = true,\n\torigin = true,\n\tfidelity = true,\n\tpersistentState = true,\n})\n\nlocal ORIGIN_KEYS: { [string]: boolean } = table.freeze({'''
              ),
              (
                  '''local function assertNonEmpty(name: string, value: string): ()\n\tassert(value ~= "", `{name} must not be empty`)\n\tassert(string.find(value, "%c") == nil, `{name} must not contain control characters`)\nend\n\nlocal function assertFiniteNumber(path: string, value: number): ()\n\tassert(value == value and value > -math.huge and value < math.huge, `{path} must be finite`)\nend\n\nlocal function assertNonNegativeInteger(path: string, value: unknown): number\n\tassert(type(value) == "number", `{path} must be a number`)\n\tlocal numericValue = value :: number\n\tassertFiniteNumber(path, numericValue)''',
                  '''local function assertNonEmpty(name: string, value: unknown): ()\n\tassert(type(value) == "string", `{name} must be a string`)\n\tlocal stringValue = value :: string\n\tassert(stringValue ~= "", `{name} must not be empty`)\n\tassert(string.find(stringValue, "%c") == nil, `{name} must not contain control characters`)\nend\n\nlocal function assertFiniteNumber(path: string, value: unknown): number\n\tassert(type(value) == "number", `{path} must be a number`)\n\tlocal numericValue = value :: number\n\tassert(numericValue == numericValue and numericValue > -math.huge and numericValue < math.huge, `{path} must be finite`)\n\treturn numericValue\nend\n\nlocal function assertNonNegativeInteger(path: string, value: unknown): number\n\tlocal numericValue = assertFiniteNumber(path, value)'''
              ),
              (
                  '''local function cloneState(state: PlainData?): PlainData\n\tlocal source = state or {}\n\tfor key in pairs(source) do''',
                  '''local function cloneState(state: PlainData?): PlainData\n\tlocal source: any\n\tif state == nil then\n\t\tsource = {}\n\telse\n\t\tsource = state :: any\n\tend\n\tassert(type(source) == "table", "persistentState must be a plain table")\n\tassert(getmetatable(source) == nil, "persistentState must not contain metatables")\n\tfor key in pairs(source) do'''
              ),
              (
                  '''\tassertNonEmpty("origin.generator", source.generator)\n\tassertFiniteNumber("origin.generatorVersion", source.generatorVersion)\n\tassert(\n\t\tsource.generatorVersion >= 1 and source.generatorVersion == math.floor(source.generatorVersion),\n\t\t"origin.generatorVersion must be a positive integer"\n\t)''',
                  '''\tassertNonEmpty("origin.generator", source.generator)\n\tlocal generatorVersion = assertFiniteNumber("origin.generatorVersion", source.generatorVersion)\n\tassert(\n\t\tgeneratorVersion >= 1 and generatorVersion == math.floor(generatorVersion),\n\t\t"origin.generatorVersion must be a positive integer"\n\t)'''
              ),
              (
                  '''\t\tgeneratorVersion = source.generatorVersion,''',
                  '''\t\tgeneratorVersion = generatorVersion,'''
              ),
              (
                  '''function WorldEntity.new(spec: NewWorldEntity): WorldEntityRecord\n\tassert(\n\t\tWorldEntity.isId(spec.id),\n\t\t"WorldEntity.id must be a non-empty stable identifier without control characters"\n\t)\n\tassertNonEmpty("WorldEntity.kind", spec.kind)\n\tlocal fidelity: Fidelity\n\tif spec.fidelity == nil then\n\t\tfidelity = "F0"\n\telse\n\t\tfidelity = spec.fidelity\n\tend\n\tassert(WorldEntity.isFidelity(fidelity), `invalid fidelity {tostring(fidelity)}`)\n\n\treturn table.freeze({\n\t\tid = spec.id,\n\t\tkind = spec.kind,\n\t\torigin = cloneOrigin(spec.origin),\n\t\tfidelity = fidelity,\n\t\tpersistentState = cloneState(spec.persistentState),\n\t\tstateRevision = 0,\n\t\trepresentationRevision = 0,\n\t})\nend''',
                  '''function WorldEntity.new(spec: NewWorldEntity): WorldEntityRecord\n\tlocal source = assertExactRecordShape(spec, NEW_ENTITY_KEYS, "NewWorldEntity")\n\tassert(\n\t\tWorldEntity.isId(source.id),\n\t\t"WorldEntity.id must be a non-empty stable identifier without control characters"\n\t)\n\tassertNonEmpty("WorldEntity.kind", source.kind)\n\tlocal fidelity: Fidelity\n\tif source.fidelity == nil then\n\t\tfidelity = "F0"\n\telse\n\t\tfidelity = source.fidelity :: Fidelity\n\tend\n\tassert(WorldEntity.isFidelity(fidelity), `invalid fidelity {tostring(fidelity)}`)\n\n\treturn table.freeze({\n\t\tid = source.id :: WorldEntityId,\n\t\tkind = source.kind :: string,\n\t\torigin = cloneOrigin(source.origin :: GenerationOrigin),\n\t\tfidelity = fidelity,\n\t\tpersistentState = cloneState(source.persistentState :: PlainData?),\n\t\tstateRevision = 0,\n\t\trepresentationRevision = 0,\n\t})\nend'''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one replacement target, found {count}: {old[:80]!r}')
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Add new/state boundary regressions
        shell: bash
        run: |
          cat > tests/world_entity_new_state_shape.luau <<'LUA'
          local WorldEntity = require("../src/shared/Reality/WorldEntity")

          local function makeOrigin()
          	return {
          		worldId = "world:new-state-shape",
          		regionId = "region:test",
          		generator = "tests.world-entity",
          		generatorVersion = 1,
          		recipeKey = "new-state-shape",
          	}
          end

          local function makeSpec()
          	return {
          		id = "entity:new-state-shape",
          		kind = "test-object",
          		origin = makeOrigin(),
          		fidelity = "F1",
          		persistentState = { open = false },
          	}
          end

          local function run(): number
          	local failures = 0

          	local function expect(name: string, condition: boolean): ()
          		if condition then
          			print(`PASS {name}`)
          		else
          			failures += 1
          			print(`FAIL {name}`)
          		end
          	end

          	local function newAccepts(spec): boolean
          		return pcall(function()
          			WorldEntity.new(spec)
          		end)
          	end

          	expect("new accepts exact mutable spec shape", newAccepts(makeSpec()))

          	local extraSpec = makeSpec()
          	extraSpec.authorityLease = "future-field"
          	expect("new rejects unknown spec field", not newAccepts(extraSpec))

          	local specReads = 0
          	local specBacking = makeSpec()
          	local metatableSpec = setmetatable({}, {
          		__index = function(_, key)
          			specReads += 1
          			return specBacking[key]
          		end,
          	})
          	expect("new rejects spec metatable", not newAccepts(metatableSpec))
          	expect("new rejects spec before __index", specReads == 0)

          	local metatableState = makeSpec()
          	metatableState.persistentState = setmetatable({ open = false }, {})
          	expect("new rejects top-level persistentState metatable", not newAccepts(metatableState))

          	local falseState = makeSpec()
          	falseState.persistentState = false
          	expect("new rejects false persistentState instead of normalizing empty", not newAccepts(falseState))

          	local missingState = makeSpec()
          	missingState.persistentState = nil
          	local missingStateOk, missingStateRecord = pcall(function()
          		return WorldEntity.new(missingState)
          	end)
          	expect(
          		"new still defaults omitted persistentState",
          		missingStateOk and next(missingStateRecord.persistentState) == nil
          	)

          	local wrongWorldId = makeSpec()
          	wrongWorldId.origin.worldId = 123
          	local wrongWorldIdOk, wrongWorldIdError = pcall(function()
          		WorldEntity.new(wrongWorldId)
          	end)
          	expect(
          		"origin primitive type failure is intentional",
          		not wrongWorldIdOk and string.find(tostring(wrongWorldIdError), "origin.worldId must be a string", 1, true) ~= nil
          	)

          	local wrongGeneratorVersion = makeSpec()
          	wrongGeneratorVersion.origin.generatorVersion = "1"
          	local wrongVersionOk, wrongVersionError = pcall(function()
          		WorldEntity.new(wrongGeneratorVersion)
          	end)
          	expect(
          		"origin numeric type failure is intentional",
          		not wrongVersionOk
          			and string.find(tostring(wrongVersionError), "origin.generatorVersion must be a number", 1, true) ~= nil
          	)

          	return failures
          end

          return run
          LUA

          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/run.luau')
          text = path.read_text()
          old_require = 'local runWorldEntity = require("./world_entity")\n'
          new_require = old_require + 'local runWorldEntityNewStateShape = require("./world_entity_new_state_shape")\n'
          if text.count(old_require) != 1:
              raise SystemExit('unexpected WorldEntity require count')
          text = text.replace(old_require, new_require)
          old_suite = '\t+ runWorldEntity()\n\t+ runWorldEntityRegistryShape()'
          new_suite = '\t+ runWorldEntity()\n\t+ runWorldEntityNewStateShape()\n\t+ runWorldEntityRegistryShape()'
          if text.count(old_suite) != 1:
              raise SystemExit('unexpected WorldEntity suite count')
          path.write_text(text.replace(old_suite, new_suite))
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git add src/shared/Reality/WorldEntity.luau tests/world_entity_new_state_shape.luau tests/run.luau
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: seal WorldEntity new/state plain-data boundary"
          git push
