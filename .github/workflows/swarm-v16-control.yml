name: Swarm V16 Mission Graph Control Fence

on:
  push:
    branches: [swarm-control]
    paths:
      - '.swarm/runtime/v16/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v16-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted control-plane code from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize pushed V16 state
        shell: bash
        env:
          CONTROL_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git fetch origin "$CONTROL_SHA" || true
          mkdir -p "$RUNNER_TEMP/after/.swarm/runtime/v16" "$RUNNER_TEMP/before/.swarm/runtime/v16"
          if git cat-file -e "$CONTROL_SHA:.swarm/runtime/v16/mission-graph.json" 2>/dev/null; then
            git show "$CONTROL_SHA:.swarm/runtime/v16/mission-graph.json" > "$RUNNER_TEMP/after/.swarm/runtime/v16/mission-graph.json"
          else
            echo "No V16 graph at pushed control tip; nothing to validate."
            exit 0
          fi
          python3 tools/swarm/v16ctl.py validate --graph "$RUNNER_TEMP/after/.swarm/runtime/v16/mission-graph.json"
          if [[ -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "$BEFORE_SHA:.swarm/runtime/v16/mission-graph.json" 2>/dev/null; then
            git show "$BEFORE_SHA:.swarm/runtime/v16/mission-graph.json" > "$RUNNER_TEMP/before/.swarm/runtime/v16/mission-graph.json"
            python3 tools/swarm/v16ctl.py transition-check \
              --before-graph "$RUNNER_TEMP/before/.swarm/runtime/v16/mission-graph.json" \
              --after-graph "$RUNNER_TEMP/after/.swarm/runtime/v16/mission-graph.json"
          fi
