name: Fix mechanism decoder narrowing

on:
  push:
    branches:
      - agent/objects/101-mechanism-state-sol56j9

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/objects/101-mechanism-state-sol56j9
          fetch-depth: 0

      - name: Apply narrowing fix
        run: python3 .github/scripts/fix_mechanism_decoder_narrowing.py

      - name: Install pinned formatter
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Format changed source
        run: stylua src/shared/Objects/ObjectGenome.luau

      - name: Remove one-shot repair machinery
        run: rm .github/scripts/fix_mechanism_decoder_narrowing.py .github/workflows/fix-mechanism-decoder-narrowing.yml

      - name: Commit decoder narrowing fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix ObjectGenome decoder type narrowing"
          git push origin HEAD:agent/objects/101-mechanism-state-sol56j9
