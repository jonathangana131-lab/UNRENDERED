name: MaterialDNA guaranteed cleanup

on:
  push:
    branches: [agent/materials/5-strict-fixtures-solc7e1]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Remove temporary MaterialDNA workflows
        shell: bash
        run: |
          rm -f .github/workflows/materialdna-format-temp.yml
          rm -f .github/workflows/materialdna-cleanup-temp.yml
          rm -f .github/workflows/materialdna-cleanup-guaranteed.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: remove temporary MaterialDNA workflows"
          git push origin HEAD:agent/materials/5-strict-fixtures-solc7e1
