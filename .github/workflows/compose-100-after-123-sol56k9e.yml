name: Compose ObjectGenome 100 After 123

on:
  push:
    branches:
      - agent/scratch/100-after-123-sol56k9e

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/scratch/100-after-123-sol56k9e
          fetch-depth: 0

      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check

      - name: Compose reviewed #100 patch on corrected mechanism contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin a10127c8c39204a94d91cb8f78c62ada16459410
          git cherry-pick a10127c8c39204a94d91cb8f78c62ada16459410
          stylua src tests
          stylua --check src tests
          selene src tests
          lune run tests/run
          rojo build default.project.json -o /tmp/unrendered.rbxlx

      - name: Retire helper and publish composed scratch head
        shell: bash
        run: |
          git rm .github/workflows/compose-100-after-123-sol56k9e.yml
          git commit -m "chore(objects): retire #100 composition helper"
          git push origin HEAD:agent/scratch/100-after-123-sol56k9e
