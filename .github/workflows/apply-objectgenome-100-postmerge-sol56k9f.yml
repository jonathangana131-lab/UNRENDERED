name: Apply ObjectGenome 100 Postmerge Review

on:
  push:
    branches:
      - agent/objects/100-postmerge-review-sol56k9f

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/objects/100-postmerge-review-sol56k9f
          fetch-depth: 0

      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check

      - name: Apply reviewed post-merge repair
        shell: bash
        run: |
          python3 .github/scripts/apply_objectgenome_100_postmerge_sol56k9f.py
          stylua src tests

      - name: Regenerate fingerprint v2 fixture goldens
        shell: bash
        run: |
          cat > tests/.print_objectgenome_fingerprint_v2.luau <<'LUA'
          local ProductionLoader = require("./support/ProductionLoader")
          local ObjectGenome = ProductionLoader.requireShared("Objects/ObjectGenome")
          local Fixtures = ProductionLoader.requireShared("Objects/ObjectGenomeFixtures")
          print(ObjectGenome.recipeFingerprint(Fixtures.officeChair))
          print(ObjectGenome.recipeFingerprint(Fixtures.officeTable))
          print(ObjectGenome.recipeFingerprint(Fixtures.filingCabinet))
          LUA
          lune run tests/.print_objectgenome_fingerprint_v2 > /tmp/fingerprints.txt
          python3 -c 'from pathlib import Path; p=Path("tests/object_genome.luau"); t=p.read_text(); vals=[x.strip() for x in Path("/tmp/fingerprints.txt").read_text().splitlines() if x.strip().startswith("object-genome-recipe:v1:")]; assert len(vals)==3, vals; markers=["__CHAIR_FINGERPRINT_V2__","__TABLE_FINGERPRINT_V2__","__CABINET_FINGERPRINT_V2__"]; [(None if t.count(m)==1 else (_ for _ in ()).throw(AssertionError(m))) for m in markers]; p.write_text(t.replace(markers[0],vals[0]).replace(markers[1],vals[1]).replace(markers[2],vals[2]))'
          rm tests/.print_objectgenome_fingerprint_v2.luau
          stylua src tests

      - name: Validate strongest local gates
        shell: bash
        run: |
          stylua --check src tests
          selene src tests
          lune run tests/run
          rojo build default.project.json -o /tmp/unrendered.rbxlx

      - name: Commit production repair and retire transport
        shell: bash
        run: |
          git rm .github/workflows/apply-objectgenome-100-postmerge-sol56k9f.yml .github/scripts/apply_objectgenome_100_postmerge_sol56k9f.py
          git add Docs/OBJECT_GENOME.md src/shared/Objects/ObjectGenome.luau tests/object_genome.luau
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(objects): close #100 review gaps"
          git push origin HEAD:agent/objects/100-postmerge-review-sol56k9f
