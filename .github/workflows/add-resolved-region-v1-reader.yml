name: Add resolved-region v1 read compatibility

on:
  push:
    branches:
      - agent/reality/9-worldid-v2-recovery-sol56q4

permissions:
  contents: write

jobs:
  add-legacy-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/reality/9-worldid-v2-recovery-sol56q4

      - name: Add isolated historical v1 reader
        shell: bash
        run: |
          set -euo pipefail
          cp src/shared/Reality/ResolvedRegionRecipe.luau src/shared/Reality/ResolvedRegionRecipeV1.luau

          python3 - <<'PY'
          from pathlib import Path

          legacy = Path('src/shared/Reality/ResolvedRegionRecipeV1.luau')
          text = legacy.read_text()
          if not text.startswith('--!strict\n'):
              raise SystemExit('legacy source did not preserve strict header')
          text = text.replace(
              '--!strict\n',
              '--!strict\n\n-- Historical schema-v1 read/reconstruction compatibility only.\n'
              '-- New canonical observations must use ResolvedRegionRecipe v2+.\n',
              1,
          )
          old_return = 'return table.freeze(ResolvedRegionRecipe)\n'
          new_return = '''local LegacyResolvedRegionRecipe = {
          \tSCHEMA_VERSION = ResolvedRegionRecipe.SCHEMA_VERSION,
          \tFINGERPRINT_VERSION = ResolvedRegionRecipe.FINGERPRINT_VERSION,
          \tdeserialize = ResolvedRegionRecipe.deserialize,
          \tserialize = ResolvedRegionRecipe.serialize,
          \tequal = ResolvedRegionRecipe.equal,
          \tfingerprint = ResolvedRegionRecipe.fingerprint,
          \treproKey = ResolvedRegionRecipe.reproKey,
          }

          return table.freeze(LegacyResolvedRegionRecipe)
          '''
          if old_return not in text:
              raise SystemExit('legacy module return marker not found')
          legacy.write_text(text.replace(old_return, new_return, 1))

          compat = Path('tests/resolved_region_recipe_v1_compat.luau')
          compat.write_text('''local ProductionLoader = require("./support/ProductionLoader")

local ResolvedRegionRecipeV1 = ProductionLoader.requireShared("Reality/ResolvedRegionRecipeV1")
local RegionAddress = ProductionLoader.requireShared("Spatial/RegionAddress")

local GOLDEN_REGION_ID = "region:v1:7cd90883b952e7534e6f3ffdd71d66a7"
local GOLDEN_RECIPE_FINGERPRINT = "resolved-region:v1:6448a82dcdebe20b03d9a6a98847bdd7"

local function historicalV1Record()
\treturn {
\t\tschemaVersion = 1,
\t\tregionId = GOLDEN_REGION_ID,
\t\tworldSeedRef = "world-seed:office-alpha",
\t\tregionAddress = RegionAddress.new(12, -4, 1),
\t\tgeneratorVersions = {
\t\t\treality = 1,
\t\t\ttopology = 1,
\t\t\tmaterial = 1,
\t\t\tobject = 1,
\t\t\tentity = 1,
\t\t},
\t\tsemanticIntentKey = "intent:commercial-office.late-90s",
\t\ttopologyAnchors = {
\t\t\t"anchor:west-service-threshold",
\t\t\t"anchor:east-primary-threshold",
\t\t},
\t\tcanonicalContentKeys = {
\t\t\t"object:chair-a",
\t\t\t"material:carpet-batch-a",
\t\t\t"fixture:fluorescent-row-a",
\t\t},
\t\trecipeFingerprint = GOLDEN_RECIPE_FINGERPRINT,
\t}
end

local function run(): number
\tlocal failures = 0

\tlocal function expect(name: string, condition: boolean): ()
\t\tif condition then
\t\t\tprint(`PASS {name}`)
\t\telse
\t\t\tfailures += 1
\t\t\tprint(`FAIL {name}`)
\t\tend
\tend

\t-- Already-observed schema-v1 truth is reconstructed from a literal record.
\t-- The isolated compatibility module intentionally exposes no observation/lock
\t-- API, so it cannot mint new canonical content under the deprecated identity law.
\tlocal locked = ResolvedRegionRecipeV1.deserialize(historicalV1Record())
\texpect("historical v1 decoder remains schema 1", ResolvedRegionRecipeV1.SCHEMA_VERSION == 1)
\texpect("historical v1 region identity remains compatible", locked.regionId == GOLDEN_REGION_ID)
\texpect(
\t\t"historical v1 recipe fingerprint remains compatible",
\t\tlocked.recipeFingerprint == GOLDEN_RECIPE_FINGERPRINT
\t)
\texpect(
\t\t"historical v1 fingerprint API remains compatible",
\t\tResolvedRegionRecipeV1.fingerprint(locked) == GOLDEN_RECIPE_FINGERPRINT
\t)

\tlocal reconstructed = ResolvedRegionRecipeV1.deserialize(ResolvedRegionRecipeV1.serialize(locked))
\texpect(
\t\t"historical v1 serialized truth remains reconstructable",
\t\tResolvedRegionRecipeV1.equal(locked, reconstructed)
\t)
\texpect("legacy v1 compatibility module exposes no new-write lock API", ResolvedRegionRecipeV1.lock == nil)
\texpect(
\t\t"legacy v1 compatibility module exposes no observation transition API",
\t\tResolvedRegionRecipeV1.resolveOnObservation == nil
\t)

\treturn failures
end

return run
''')
          PY

      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check

      - name: Format Luau
        run: stylua src tests

      - name: Commit legacy reader and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-resolved-region-v1-reader.yml
          git add src/shared/Reality/ResolvedRegionRecipeV1.luau tests/resolved_region_recipe_v1_compat.luau
          git commit -m "test(reality): preserve read-only v1 reconstruction oracle"
          git push origin HEAD:agent/reality/9-worldid-v2-recovery-sol56q4
