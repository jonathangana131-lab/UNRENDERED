name: Add resolved-region v1 read compatibility

on:
  push:
    branches:
      - agent/reality/9-worldid-v2-recovery-sol56q4

permissions:
  contents: write

jobs:
  add-legacy-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/reality/9-worldid-v2-recovery-sol56q4

      - name: Add isolated historical v1 reader
        shell: bash
        run: |
          set -euo pipefail
          cp src/shared/Reality/ResolvedRegionRecipe.luau src/shared/Reality/ResolvedRegionRecipeV1.luau
          python3 - <<'PY'
          from pathlib import Path

          legacy = Path("src/shared/Reality/ResolvedRegionRecipeV1.luau")
          text = legacy.read_text()
          if not text.startswith("--!strict\n"):
              raise SystemExit("legacy source did not preserve strict header")
          text = text.replace(
              "--!strict\n",
              "--!strict\n\n-- Historical schema-v1 read/reconstruction compatibility only.\n-- New canonical observations must use ResolvedRegionRecipe v2+.\n",
              1,
          )
          old_return = "return table.freeze(ResolvedRegionRecipe)\n"
          new_return = """local LegacyResolvedRegionRecipe = {
          \tSCHEMA_VERSION = ResolvedRegionRecipe.SCHEMA_VERSION,
          \tFINGERPRINT_VERSION = ResolvedRegionRecipe.FINGERPRINT_VERSION,
          \tdeserialize = ResolvedRegionRecipe.deserialize,
          \tserialize = ResolvedRegionRecipe.serialize,
          \tequal = ResolvedRegionRecipe.equal,
          \tfingerprint = ResolvedRegionRecipe.fingerprint,
          \treproKey = ResolvedRegionRecipe.reproKey,
          }

          return table.freeze(LegacyResolvedRegionRecipe)
          """
          if old_return not in text:
              raise SystemExit("legacy module return marker not found")
          legacy.write_text(text.replace(old_return, new_return, 1))
          PY

          cat > tests/resolved_region_recipe_v1_compat.luau <<'EOF'
          local ProductionLoader = require("./support/ProductionLoader")

          local ResolvedRegionRecipeV1 = ProductionLoader.requireShared("Reality/ResolvedRegionRecipeV1")
          local RegionAddress = ProductionLoader.requireShared("Spatial/RegionAddress")

          local GOLDEN_REGION_ID = "region:v1:7cd90883b952e7534e6f3ffdd71d66a7"
          local GOLDEN_RECIPE_FINGERPRINT = "resolved-region:v1:6448a82dcdebe20b03d9a6a98847bdd7"

          local function historicalV1Record()
          	return {
          		schemaVersion = 1,
          		regionId = GOLDEN_REGION_ID,
          		worldSeedRef = "world-seed:office-alpha",
          		regionAddress = RegionAddress.new(12, -4, 1),
          		generatorVersions = {
          			reality = 1,
          			topology = 1,
          			material = 1,
          			object = 1,
          			entity = 1,
          		},
          		semanticIntentKey = "intent:commercial-office.late-90s",
          		topologyAnchors = {
          			"anchor:west-service-threshold",
          			"anchor:east-primary-threshold",
          		},
          		canonicalContentKeys = {
          			"object:chair-a",
          			"material:carpet-batch-a",
          			"fixture:fluorescent-row-a",
          		},
          		recipeFingerprint = GOLDEN_RECIPE_FINGERPRINT,
          	}
          end

          local function run(): number
          	local failures = 0

          	local function expect(name: string, condition: boolean): ()
          		if condition then
          			print(`PASS {name}`)
          		else
          			failures += 1
          			print(`FAIL {name}`)
          		end
          	end

          	-- Already-observed schema-v1 truth is reconstructed from a literal record.
          	-- The isolated compatibility module intentionally exposes no observation/lock
          	-- API, so it cannot mint new canonical content under the deprecated identity law.
          	local locked = ResolvedRegionRecipeV1.deserialize(historicalV1Record())
          	expect("historical v1 decoder remains schema 1", ResolvedRegionRecipeV1.SCHEMA_VERSION == 1)
          	expect("historical v1 region identity remains compatible", locked.regionId == GOLDEN_REGION_ID)
          	expect(
          		"historical v1 recipe fingerprint remains compatible",
          		locked.recipeFingerprint == GOLDEN_RECIPE_FINGERPRINT
          	)
          	expect(
          		"historical v1 fingerprint API remains compatible",
          		ResolvedRegionRecipeV1.fingerprint(locked) == GOLDEN_RECIPE_FINGERPRINT
          	)

          	local reconstructed = ResolvedRegionRecipeV1.deserialize(ResolvedRegionRecipeV1.serialize(locked))
          	expect(
          		"historical v1 serialized truth remains reconstructable",
          		ResolvedRegionRecipeV1.equal(locked, reconstructed)
          	)
          	expect("legacy v1 compatibility module exposes no new-write lock API", ResolvedRegionRecipeV1.lock == nil)
          	expect(
          		"legacy v1 compatibility module exposes no observation transition API",
          		ResolvedRegionRecipeV1.resolveOnObservation == nil
          	)

          	return failures
          end

          return run
          EOF

      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check

      - name: Format Luau
        run: stylua src tests

      - name: Commit legacy reader and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-resolved-region-v1-reader.yml
          git add src/shared/Reality/ResolvedRegionRecipeV1.luau tests/resolved_region_recipe_v1_compat.luau
          git commit -m "test(reality): preserve read-only v1 reconstruction oracle"
          git push origin HEAD:agent/reality/9-worldid-v2-recovery-sol56q4
