name: StableId Lune Prerequisite

on:
  push:
    branches: [agent/integration/6-stableid-lune-prereq-5c8e]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false

      - name: Make production StableId portable to Roblox and Lune
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          stable = Path('src/shared/Core/StableId.luau')
          s = stable.read_text()
          old = 'local DeterminismContract = require(script.Parent.DeterminismContract)\n'
          new = '''local requireAny = require :: any
local scriptValue = script :: any
local DeterminismContract = if scriptValue ~= nil
\tthen requireAny(scriptValue.Parent.DeterminismContract)
\telse requireAny("./DeterminismContract")
'''
          if s.count(old) != 1:
              raise SystemExit(f'StableId dependency anchor mismatch: {s.count(old)}')
          stable.write_text(s.replace(old, new))

          test = Path('tests/stable_id_headless.luau')
          test.write_text('''local StableId = require("../src/shared/Core/StableId")

local function run(): number
\tlocal failures = 0

\tlocal function expectEqual(name, actual, expected)
\t\tif actual ~= expected then
\t\t\tfailures += 1
\t\t\tprint(`FAIL stable_id_headless {name}: expected {tostring(expected)}, got {tostring(actual)}`)
\t\telse
\t\t\tprint(`PASS stable_id_headless {name}`)
\t\tend
\tend

\tlocal worldId = StableId.fromParts("world", { "alpha" })
\texpectEqual("loads production StableId under Lune", worldId, "world:v1:9fa76d9d4d3f004052fffe125f6bfb2a")
\texpectEqual("contract version remains canonical", StableId.ContractVersion, 1)
\texpectEqual("recognizes canonical namespace", StableId.is(worldId, "world"), true)
\texpectEqual("rejects wrong namespace", StableId.is(worldId, "entity"), false)

\treturn failures
end

return run
''')

          runner = Path('tests/run.luau')
          s = runner.read_text()
          require_anchor = 'local runMaterialDNA = require("./materialdna_contract")\n'
          if 'local runStableIdHeadless = require("./stable_id_headless")' not in s:
              if s.count(require_anchor) != 1:
                  raise SystemExit('runner require anchor mismatch')
              s = s.replace(require_anchor, require_anchor + 'local runStableIdHeadless = require("./stable_id_headless")\n')
          call_anchor = '\t+ runMaterialDNA()\n'
          if '\t+ runStableIdHeadless()' not in s:
              if s.count(call_anchor) != 1:
                  raise SystemExit('runner call anchor mismatch')
              s = s.replace(call_anchor, call_anchor + '\t+ runStableIdHeadless()\n')
          runner.write_text(s)
          PY

      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check
          rokit list

      - name: Generate Rojo sourcemap
        run: rojo sourcemap default.project.json --output sourcemap.json

      - name: Download pinned Roblox type definitions
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.69.0/scripts/globalTypes.d.luau \
            -o globalTypes.d.luau

      - name: Apply pinned StyLua
        run: stylua src tests

      - name: Format check
        run: stylua --check src tests

      - name: Lint
        run: selene src tests

      - name: Luau analysis
        run: luau-lsp analyze --platform=roblox --definitions:@roblox=globalTypes.d.luau --sourcemap=sourcemap.json src

      - name: Canonical randomness audit
        run: |
          python3 scripts/check_canonical_randomness.py --self-test
          python3 scripts/check_canonical_randomness.py

      - name: Shared-domain boundary audit
        run: |
          python3 scripts/check_domain_boundaries.py --self-test
          python3 scripts/check_domain_boundaries.py

      - name: Pure Luau tests
        run: lune run tests/run

      - name: Build place file
        run: |
          mkdir -p build
          rojo build default.project.json --output build/UNRENDERED.rbxlx

      - name: Publish clean prerequisite head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stableid-lune-prereq.yml
          git add src/shared/Core/StableId.luau tests/stable_id_headless.luau tests/run.luau
          git commit -m "fix: make StableId deterministic path headless-testable"
          git push origin HEAD:agent/integration/6-stableid-lune-prereq-5c8e
