name: Repair ObjectGenome Recipe Fingerprint

on:
  push:
    branches:
      - agent/scratch/100-recipe-fingerprint-sol56k9c

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/scratch/100-recipe-fingerprint-sol56k9c
          fetch-depth: 0

      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check

      - name: Apply reviewed repair
        shell: bash
        run: |
          git fetch origin agent/objects/100-materialref-identity-sol56k9b
          git checkout origin/agent/objects/100-materialref-identity-sol56k9b -- Docs/OBJECT_GENOME.md src/shared/Objects/ObjectGenome.luau tests/object_genome.luau
          python3 .github/scripts/apply_objectgenome_recipe_fingerprint_sol56k9c.py
          stylua src tests

      - name: Lock fixture recipe fingerprints
        shell: bash
        run: |
          cat > tests/.print_objectgenome_fingerprints.luau <<'LUA'
          local ProductionLoader = require("./support/ProductionLoader")
          local ObjectGenome = ProductionLoader.requireShared("Objects/ObjectGenome")
          local Fixtures = ProductionLoader.requireShared("Objects/ObjectGenomeFixtures")
          print(ObjectGenome.recipeFingerprint(Fixtures.officeChair))
          print(ObjectGenome.recipeFingerprint(Fixtures.officeTable))
          print(ObjectGenome.recipeFingerprint(Fixtures.filingCabinet))
          LUA
          lune run tests/.print_objectgenome_fingerprints > /tmp/fingerprints.txt
          python3 -c 'from pathlib import Path; p=Path("tests/object_genome.luau"); t=p.read_text(); vals=[x.strip() for x in Path("/tmp/fingerprints.txt").read_text().splitlines() if x.strip().startswith("object-genome-recipe:v1:")]; assert len(vals)==3, vals; markers=["__CHAIR_FINGERPRINT__","__TABLE_FINGERPRINT__","__CABINET_FINGERPRINT__"]; [(None if t.count(m)==1 else (_ for _ in ()).throw(AssertionError(m))) for m in markers]; p.write_text(t.replace(markers[0],vals[0]).replace(markers[1],vals[1]).replace(markers[2],vals[2]))'
          rm tests/.print_objectgenome_fingerprints.luau
          stylua src tests

      - name: Validate strongest local gates
        shell: bash
        run: |
          stylua --check src tests
          selene src tests
          lune run tests/run
          rojo build default.project.json -o /tmp/unrendered.rbxlx

      - name: Commit production patch and retire scratch machinery
        shell: bash
        run: |
          git rm .github/workflows/repair-objectgenome-recipe-fingerprint-sol56k9c.yml .github/scripts/apply_objectgenome_recipe_fingerprint_sol56k9c.py
          git add Docs/OBJECT_GENOME.md src/shared/Objects/ObjectGenome.luau tests/object_genome.luau
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(objects): add full immutable recipe fingerprint"
          git push origin HEAD:agent/scratch/100-recipe-fingerprint-sol56k9c
