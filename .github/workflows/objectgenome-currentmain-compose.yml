name: ObjectGenome Current Main Compose

on:
  push:
    branches: [agent/integration/6-objectgenome-currentmain-91d4]

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Import reviewed ObjectGenome and preserve landed suites
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SOURCE=agent/integration/6-objectgenome-transform-rebase-sol56c8
          git fetch origin "$SOURCE"
          git restore --source="origin/$SOURCE" -- \
            Docs/OBJECT_GENOME.md \
            src/shared/Objects/ObjectGenome.luau \
            src/shared/Objects/ObjectGenomeFixtures.luau \
            src/shared/Objects/ObjectGenomeOwnership.luau \
            tests/object_genome.luau \
            tests/object_genome_contract_lock.luau

          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/run.luau')
          s = p.read_text()
          require_anchor = 'local runMaterialDNA = require("./materialdna_contract")\n'
          require_add = require_anchor + 'local runObjectGenome = require("./object_genome")\nlocal runObjectGenomeContractLock = require("./object_genome_contract_lock")\n'
          if 'local runObjectGenome = require("./object_genome")' not in s:
              if s.count(require_anchor) != 1:
                  raise SystemExit('MaterialDNA require anchor not unique')
              s = s.replace(require_anchor, require_add)

          call_anchor = '\t+ runMaterialDNA()\n'
          call_add = call_anchor + '\t+ runObjectGenome()\n\t+ runObjectGenomeContractLock()\n'
          if '\t+ runObjectGenome()' not in s:
              if s.count(call_anchor) != 1:
                  raise SystemExit('MaterialDNA call anchor not unique')
              s = s.replace(call_anchor, call_add)
          p.write_text(s)
          PY

          git rm .github/workflows/objectgenome-currentmain-compose.yml
          git add Docs/OBJECT_GENOME.md src/shared/Objects tests/object_genome.luau tests/object_genome_contract_lock.luau tests/run.luau
          git commit -m "feat: compose Reality-Grade ObjectGenome contract"
          git push origin HEAD:agent/integration/6-objectgenome-currentmain-91d4
