name: Compose ObjectGenome exact shape

on:
  push:
    branches:
      - agent/integration/6-objectgenome-final-sol56q4

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/integration/6-objectgenome-final-sol56q4
          fetch-depth: 0

      - name: Compose reviewed exact-shape commits
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git cherry-pick 7466d30e0d9c5e10e7f490b6779dfb1830f53ed5
          git cherry-pick cfafdab6b87d7e393b53ca134be248cef0a4d813
          rm .github/workflows/compose-objectgenome-exact-shape.yml
          git add -A
          git commit -m "ci: remove exact-shape composition helper"
          git push origin HEAD:agent/integration/6-objectgenome-final-sol56q4
