name: Format 156 resolved region

on:
  push:
    branches:
      - agent/reality/9-resolved-region-lock-sol56j3

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/reality/9-resolved-region-lock-sol56j3
          fetch-depth: 0
      - name: Install pinned toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check
      - name: Format changed Luau and retire helper
        shell: bash
        run: |
          stylua src/shared/Reality/ResolvedRegionRecipe.luau src/shared/Spatial/RegionAddress.luau tests/resolved_region_recipe.luau tests/resolved_region_global_truth.luau tests/run.luau
          rm .github/workflows/format-156-resolved-region.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/Reality/ResolvedRegionRecipe.luau src/shared/Spatial/RegionAddress.luau tests/resolved_region_recipe.luau tests/resolved_region_global_truth.luau tests/run.luau .github/workflows/format-156-resolved-region.yml
          git commit -m "style(reality): format resolved-region contract"
          git push origin HEAD:agent/reality/9-resolved-region-lock-sol56j3
