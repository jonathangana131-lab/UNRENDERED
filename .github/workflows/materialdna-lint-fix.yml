name: MaterialDNA Lint Fix

on:
  push:
    branches: [agent/integration/5-materialdna-currentmain-sol56d2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Replace manual clone
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("src/shared/Materials/MaterialDNA.luau"); s=p.read_text(); old="\tlocal keys: { string } = {}\n\tfor index, key in value do\n\t\tkeys[index] = key\n\tend\n"; assert s.count(old) == 1, s.count(old); p.write_text(s.replace(old, "\tlocal keys: { string } = table.clone(value)\n"))'

      - name: Commit lint fix
        shell: bash
        run: |
          git add src/shared/Materials/MaterialDNA.luau
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: use native clone for material keys"
          git push
