name: MaterialDNA Lint Fix

on:
  push:
    branches: [agent/integration/5-materialdna-currentmain-sol56d2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Replace manual clone
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/shared/Materials/MaterialDNA.luau')
          text = path.read_text()
          old = '''local function freezeKeys(value: { string }): { string }
\tlocal keys: { string } = {}
\tfor index, key in value do
\t\tkeys[index] = key
\tend
\treturn table.freeze(keys)
end'''
          new = '''local function freezeKeys(value: { string }): { string }
\tlocal keys: { string } = table.clone(value)
\treturn table.freeze(keys)
end'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one freezeKeys block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit lint fix
        shell: bash
        run: |
          git add src/shared/Materials/MaterialDNA.luau
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: use native clone for material keys"
          git push
