name: Temporary #9 integration formatter

on:
  push:
    branches:
      - agent/review/9-converge-delta-base-sol56s2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/review/9-converge-delta-base-sol56s2
      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check
      - name: Apply pinned StyLua
        shell: bash
        run: |
          stylua src tests
          if git diff --quiet -- src tests; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "style: apply pinned StyLua"
          git push origin HEAD:agent/review/9-converge-delta-base-sol56s2
