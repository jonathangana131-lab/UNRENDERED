name: Branch Autoformat

on:
  push:
    branches:
      - agent/physicslab/191-authority-first-followup-sol56u1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/physicslab/191-authority-first-followup-sol56u1
      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check
      - name: Format authority-first adapter
        shell: bash
        run: |
          stylua src/server/PhysicsLab/PhysicsLabRealizer.luau
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/PhysicsLab/PhysicsLabRealizer.luau
          git commit -m "style(physicslab): format authority-first realizer"
          git push origin HEAD:agent/physicslab/191-authority-first-followup-sol56u1
