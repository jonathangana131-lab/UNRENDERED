name: Branch Autoformat

on:
  push:
    branches:
      - agent/ci/191-transition-test-sol56j9

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ci/191-transition-test-sol56j9
      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check
      - name: Format complete repair surface
        shell: bash
        run: |
          stylua src/shared/Physics/PhysicsLabRuntime.luau tests/physics_lab_runtime_transition_required.luau
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/Physics/PhysicsLabRuntime.luau tests/physics_lab_runtime_transition_required.luau
          git commit -m "style(physicslab): format red-main transition repair"
          git push origin HEAD:agent/ci/191-transition-test-sol56j9
