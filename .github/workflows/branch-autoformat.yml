name: Branch Autoformat

on:
  push:
    branches:
      - agent/reality/183-worldid-v2-compat-sol56j9

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/reality/183-worldid-v2-compat-sol56j9
      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check
      - name: Format changed Luau
        shell: bash
        run: |
          stylua src/shared/Reality/ResolvedRegionRecipe.luau src/shared/Reality/ResolvedRegionRecipeV1.luau tests/resolved_region_recipe.luau tests/resolved_region_recipe_v1_compat.luau tests/resolved_region_recipe_v2_compat.luau tests/run.luau
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/Reality/ResolvedRegionRecipe.luau src/shared/Reality/ResolvedRegionRecipeV1.luau tests/resolved_region_recipe.luau tests/resolved_region_recipe_v1_compat.luau tests/resolved_region_recipe_v2_compat.luau tests/run.luau
          git commit -m "style: format resolved-region v2 compatibility repair"
          git push origin HEAD:agent/reality/183-worldid-v2-compat-sol56j9
