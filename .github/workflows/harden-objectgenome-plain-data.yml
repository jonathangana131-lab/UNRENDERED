name: Harden ObjectGenome plain-data boundary

on:
  push:
    branches:
      - agent/integration/6-objectgenome-final-sol56q4

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/integration/6-objectgenome-final-sol56q4
          fetch-depth: 0

      - name: Install pinned toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check

      - name: Harden exact shape and metatable rejection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/shared/Objects/ObjectGenome.luau")
          source = path.read_text()

          old = '''local COMPONENT_FIELDS = {\n\tkey = true,\n\trole = true,\n\tmaterialKey = true,\n\tmassKg = true,'''
          new = '''local COMPONENT_FIELDS = {\n\tkey = true,\n\trole = true,\n\tmaterialKey = true,\n\tmaterialRecipeVersion = true,\n\tmassKg = true,'''
          if old not in source:
              raise SystemExit("component-field marker changed")
          source = source.replace(old, new, 1)

          marker = '''local AFFORDANCE_FIELDS = {\n\tkey = true,\n\tkind = true,\n\tcomponentKey = true,\n\tlocalPointM = true,\n\tradiusM = true,\n}\n'''
          state_fields = marker + '''\nlocal STATE_FIELDS = {\n\tstateSchemaVersion = true,\n\tgenomeId = true,\n\tcomponentWear = true,\n\tcomponentDamage = true,\n\tmechanismPosition = true,\n\tdetachedComponents = true,\n}\n'''
          if marker not in source:
              raise SystemExit("affordance-field marker changed")
          source = source.replace(marker, state_fields, 1)

          marker = '''local function validateRecordShape(\n'''
          helpers = '''local function safeKeyLabel(key: any): string\n\tlocal keyType = type(key)\n\tif keyType == "string" then\n\t\treturn key\n\telseif keyType == "number" or keyType == "boolean" then\n\t\treturn tostring(key)\n\tend\n\treturn `<{keyType}>`\nend\n\nlocal function rejectMetatable(issues: { ValidationIssue }, path: string, value: any): boolean\n\tif type(value) == "table" and getmetatable(value) ~= nil then\n\t\taddIssue(issues, "schema.metatable", path, "canonical plain-data tables must not have metatables")\n\t\treturn true\n\tend\n\treturn false\nend\n\nlocal function validatePlainGenomeTables(issues: { ValidationIssue }, value: any): boolean\n\tlocal valid = true\n\n\tlocal function check(path: string, candidate: any): boolean\n\t\tif rejectMetatable(issues, path, candidate) then\n\t\t\tvalid = false\n\t\t\treturn false\n\t\tend\n\t\treturn true\n\tend\n\n\tif not check("$", value) then\n\t\treturn false\n\tend\n\n\tcheck("provenance", rawget(value, "provenance"))\n\tcheck("dimensionsM", rawget(value, "dimensionsM"))\n\n\tlocal dimensionLimits = rawget(value, "dimensionLimits")\n\tif check("dimensionLimits", dimensionLimits) and type(dimensionLimits) == "table" then\n\t\tcheck("dimensionLimits.minM", rawget(dimensionLimits, "minM"))\n\t\tcheck("dimensionLimits.maxM", rawget(dimensionLimits, "maxM"))\n\tend\n\n\tcheck("massLimitsKg", rawget(value, "massLimitsKg"))\n\tcheck("centerOfMassM", rawget(value, "centerOfMassM"))\n\n\tlocal components = rawget(value, "components")\n\tif check("components", components) and type(components) == "table" then\n\t\tfor index, component in next, components do\n\t\t\tif type(index) == "number" and type(component) == "table" then\n\t\t\t\tlocal componentPath = `components[{index}]`\n\t\t\t\tif check(componentPath, component) then\n\t\t\t\t\tcheck(componentPath .. ".localPositionM", rawget(component, "localPositionM"))\n\t\t\t\t\tcheck(componentPath .. ".localRotationDeg", rawget(component, "localRotationDeg"))\n\t\t\t\t\tcheck(componentPath .. ".dimensionsM", rawget(component, "dimensionsM"))\n\t\t\t\t\tcheck(componentPath .. ".supportKeys", rawget(component, "supportKeys"))\n\t\t\t\tend\n\t\t\tend\n\t\tend\n\tend\n\n\tlocal mechanisms = rawget(value, "mechanisms")\n\tif check("mechanisms", mechanisms) and type(mechanisms) == "table" then\n\t\tfor index, mechanism in next, mechanisms do\n\t\t\tif type(index) == "number" and type(mechanism) == "table" then\n\t\t\t\tlocal mechanismPath = `mechanisms[{index}]`\n\t\t\t\tif check(mechanismPath, mechanism) then\n\t\t\t\t\tlocal kind = rawget(mechanism, "kind")\n\t\t\t\t\tif kind == "hinge" or kind == "slide" or kind == "tilt" then\n\t\t\t\t\t\tcheck(mechanismPath .. ".axis", rawget(mechanism, "axis"))\n\t\t\t\t\telseif kind == "caster" then\n\t\t\t\t\t\tcheck(mechanismPath .. ".swivelAxis", rawget(mechanism, "swivelAxis"))\n\t\t\t\t\t\tcheck(mechanismPath .. ".rollAxis", rawget(mechanism, "rollAxis"))\n\t\t\t\t\tend\n\t\t\t\tend\n\t\t\tend\n\t\tend\n\tend\n\n\tlocal affordances = rawget(value, "affordances")\n\tif check("affordances", affordances) and type(affordances) == "table" then\n\t\tfor index, affordance in next, affordances do\n\t\t\tif type(index) == "number" and type(affordance) == "table" then\n\t\t\t\tlocal affordancePath = `affordances[{index}]`\n\t\t\t\tif check(affordancePath, affordance) then\n\t\t\t\t\tcheck(affordancePath .. ".localPointM", rawget(affordance, "localPointM"))\n\t\t\t\tend\n\t\t\tend\n\t\tend\n\tend\n\n\treturn valid\nend\n\n'''
          if marker not in source:
              raise SystemExit("validateRecordShape marker changed")
          source = source.replace(marker, helpers + marker, 1)
          source = source.replace('tostring(key)', 'safeKeyLabel(key)')
          # Restore the intentional primitive conversion inside safeKeyLabel itself.
          source = source.replace('return safeKeyLabel(key)\n\tend\n\treturn `<{keyType}>`', 'return tostring(key)\n\tend\n\treturn `<{keyType}>`', 1)

          old = '''\tif type(value) ~= "table" then\n\t\taddIssue(issues, "genome.type", "$", "ObjectGenome must be a plain table")\n\t\treturn reportResult(issues)\n\tend\n\n\tvalidateGenomeShape(issues, value)\n'''
          new = '''\tif type(value) ~= "table" then\n\t\taddIssue(issues, "genome.type", "$", "ObjectGenome must be a plain table")\n\t\treturn reportResult(issues)\n\tend\n\n\tif not validatePlainGenomeTables(issues, value) then\n\t\treturn reportResult(issues)\n\tend\n\n\tvalidateGenomeShape(issues, value)\n'''
          if old not in source:
              raise SystemExit("inspect preflight marker changed")
          source = source.replace(old, new, 1)

          old = '''\tif type(state) ~= "table" then\n\t\taddIssue(issues, "state.type", "$", "ObjectState must be a plain table")\n\t\treturn reportResult(issues)\n\tend\n\tif state.stateSchemaVersion ~= ObjectGenome.STATE_SCHEMA_VERSION then\n'''
          new = '''\tif type(state) ~= "table" then\n\t\taddIssue(issues, "state.type", "$", "ObjectState must be a plain table")\n\t\treturn reportResult(issues)\n\tend\n\tif getmetatable(state) ~= nil then\n\t\taddIssue(issues, "state.metatable", "$", "ObjectState must not have a metatable")\n\t\treturn reportResult(issues)\n\tend\n\tfor key in next, state do\n\t\tif type(key) ~= "string" or not STATE_FIELDS[key] then\n\t\t\taddIssue(\n\t\t\t\tissues,\n\t\t\t\t"state.unknown_field",\n\t\t\t\t`$.{safeKeyLabel(key)}`,\n\t\t\t\t"field is not declared by ObjectState schema v1"\n\t\t\t)\n\t\tend\n\tend\n\tif state.stateSchemaVersion ~= ObjectGenome.STATE_SCHEMA_VERSION then\n'''
          if old not in source:
              raise SystemExit("state preflight marker changed")
          source = source.replace(old, new, 1)

          old = '''\t\tif type(mapValue) ~= "table" then\n\t\t\taddIssue(issues, "state.collection", fieldName, `{fieldName} must be a table`)\n\t\t\treturn\n\t\tend\n\t\tfor key in pairs(knownKeys) do\n'''
          new = '''\t\tif type(mapValue) ~= "table" then\n\t\t\taddIssue(issues, "state.collection", fieldName, `{fieldName} must be a table`)\n\t\t\treturn\n\t\tend\n\t\tif getmetatable(mapValue) ~= nil then\n\t\t\taddIssue(issues, "state.metatable", fieldName, `{fieldName} must not have a metatable`)\n\t\t\treturn\n\t\tend\n\t\tfor key in pairs(knownKeys) do\n'''
          if old not in source:
              raise SystemExit("state map marker changed")
          source = source.replace(old, new, 1)

          old = '''\tif type(state.detachedComponents) ~= "table" then\n\t\taddIssue(issues, "state.collection", "detachedComponents", "detachedComponents must be a table")\n\telse\n\t\tfor key in pairs(componentKeys) do\n'''
          new = '''\tif type(state.detachedComponents) ~= "table" then\n\t\taddIssue(issues, "state.collection", "detachedComponents", "detachedComponents must be a table")\n\telseif getmetatable(state.detachedComponents) ~= nil then\n\t\taddIssue(issues, "state.metatable", "detachedComponents", "detachedComponents must not have a metatable")\n\telse\n\t\tfor key in pairs(componentKeys) do\n'''
          if old not in source:
              raise SystemExit("detached map marker changed")
          source = source.replace(old, new, 1)

          path.write_text(source)

          test_path = Path("tests/object_genome_contract_lock.luau")
          tests = test_path.read_text()
          marker = '''\tlocal sparseComponents = deepCopy(Fixtures.officeChair)\n'''
          additions = '''\tlocal metatableGenome = deepCopy(Fixtures.officeChair)\n\tsetmetatable(metatableGenome.provenance, { __index = function()\n\t\treturn "spoofed"\n\tend })\n\texpect(\n\t\t"semantic validator rejects metatable-backed canonical records",\n\t\thasCode(ObjectGenome.inspect(metatableGenome), "schema.metatable")\n\t)\n\n\tlocal unknownStateField = ObjectGenome.defaultState(Fixtures.officeChair)\n\tunknownStateField.futureState = true\n\texpect(\n\t\t"rejects undeclared top-level ObjectState fields",\n\t\thasCode(ObjectGenome.inspectState(Fixtures.officeChair, unknownStateField), "state.unknown_field")\n\t)\n\n\tlocal metatableState = ObjectGenome.defaultState(Fixtures.officeChair)\n\tsetmetatable(metatableState.componentWear, { __index = function()\n\t\treturn 0\n\tend })\n\texpect(\n\t\t"rejects metatable-backed mutable state maps",\n\t\thasCode(ObjectGenome.inspectState(Fixtures.officeChair, metatableState), "state.metatable")\n\t)\n\n'''
          if marker not in tests:
              raise SystemExit("contract-lock insertion marker changed")
          tests = tests.replace(marker, additions + marker, 1)
          test_path.write_text(tests)
          PY

          stylua src/shared/Objects/ObjectGenome.luau tests/object_genome_contract_lock.luau
          lune run tests/run
          rm .github/workflows/harden-objectgenome-plain-data.yml

      - name: Commit validated hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden ObjectGenome plain-data validation"
          git push origin HEAD:agent/integration/6-objectgenome-final-sol56q4
