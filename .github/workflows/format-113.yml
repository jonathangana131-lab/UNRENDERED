name: Format issue 71 regression

on:
  push:
    branches:
      - agent/reality/71-falsy-state-sol56s3

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/reality/71-falsy-state-sol56s3
          fetch-depth: 0

      - name: Apply exact StyLua delta
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tests/world_entity_registry_shape.luau")
          source = path.read_text()
          old = '\t\texpect("new defaults omitted persistent state to empty data", next(omittedStateEntity.persistentState) == nil)\n'
          new = '''\t\texpect(
          \t\t\t"new defaults omitted persistent state to empty data",
          \t\t\tnext(omittedStateEntity.persistentState) == nil
          \t\t)
          '''
          if source.count(old) != 1:
              raise SystemExit("StyLua marker not found exactly once")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/format-113.yml

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/world_entity_registry_shape.luau .github/workflows/format-113.yml
          git commit -m "Format falsy-state regression"
          git push origin HEAD:agent/reality/71-falsy-state-sol56s3
