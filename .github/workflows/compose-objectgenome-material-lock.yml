name: Compose ObjectGenome material lock

on:
  push:
    branches:
      - agent/objects/100-materialref-lock-integration-sol56q4

permissions:
  contents: write

jobs:
  compose-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/objects/100-materialref-lock-integration-sol56q4
          fetch-depth: 0

      - name: Install pinned toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check

      - name: Apply tested repair onto current main
        shell: bash
        run: |
          git fetch origin agent/objects/6-materialref-identity-sol56k9
          git diff 5ffa2e5ea7906a0900a709523c3b1cf0350a91c2 3f5f9936f9f45be8808c05f83a91a19e57821b59 -- \
            Docs/OBJECT_GENOME.md \
            src/shared/Objects/ObjectGenome.luau \
            tests/object_genome.luau > /tmp/objectgenome-material-lock.patch
          test -s /tmp/objectgenome-material-lock.patch
          git apply --3way /tmp/objectgenome-material-lock.patch
          git diff --check

      - name: Run full Foundation gate
        shell: bash
        run: |
          stylua src tests
          stylua --check src tests
          selene src tests
          lune run tests/run.luau

      - name: Commit resolved repair
        shell: bash
        run: |
          rm .github/workflows/compose-objectgenome-material-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Lock exact ObjectGenome MaterialDNA boundary"
          git push origin HEAD:agent/objects/100-materialref-lock-integration-sol56q4
