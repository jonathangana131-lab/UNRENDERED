name: Branch Lint Capture

on:
  push:
    branches:
      - agent/reality/9-resolved-region-lock-sol56j3

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/reality/9-resolved-region-lock-sol56j3
      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check
      - name: Capture lint output
        shell: bash
        run: |
          selene src tests > branch-lint-output.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add branch-lint-output.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: capture branch lint output"
          git push origin HEAD:agent/reality/9-resolved-region-lock-sol56j3
