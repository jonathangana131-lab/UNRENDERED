name: MaterialDNA Boundary Fix

on:
  push:
    branches: [agent/integration/5-materialdna-currentmain-sol56d2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Broaden external asset scheme rejection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/shared/Materials/MaterialDNA.luau')
          text = path.read_text()
          old = 'string.find(lowered, "rbxassetid://", 1, true)'
          new = 'string.find(lowered, "rbxassetid:", 1, true)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one Roblox asset scheme check, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit boundary fix
        shell: bash
        run: |
          git add src/shared/Materials/MaterialDNA.luau
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: reject Roblox asset scheme without embedding binding"
          git push
