name: Format PR183

on:
  push:
    branches:
      - agent/reality/9-worldid-region-identity-sol56s2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/reality/9-worldid-region-identity-sol56s2
      - name: Install pinned toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check
      - name: Format production and tests
        run: stylua src tests
      - name: Commit formatter output and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-pr183.yml
          git add src tests
          git commit -m "style(reality): apply pinned formatter to v2 repair"
          git push origin HEAD:agent/reality/9-worldid-region-identity-sol56s2
