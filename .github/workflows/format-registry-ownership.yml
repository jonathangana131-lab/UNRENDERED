name: Format registry ownership repair

on:
  push:
    branches:
      - agent/reality/60-registry-record-ownership-sol56s4

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check

      - name: Apply pinned StyLua
        run: stylua src/shared/Reality/WorldEntity.luau tests/world_entity.luau

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "unrendered-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/shared/Reality/WorldEntity.luau tests/world_entity.luau
          git commit -m "style(reality): apply pinned StyLua"
          git push
