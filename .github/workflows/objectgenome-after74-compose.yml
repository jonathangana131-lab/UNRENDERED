name: ObjectGenome After MaterialDNA Revision Compose

on:
  push:
    branches: [agent/integration/6-objectgenome-after74-a6d3]

permissions:
  contents: write

jobs:
  compose-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false

      - name: Import reviewed ObjectGenome foundation
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=agent/integration/6-objectgenome-transform-rebase-sol56c8
          git fetch origin "$SOURCE"
          git restore --source="origin/$SOURCE" -- \
            Docs/OBJECT_GENOME.md \
            src/shared/Objects/ObjectGenome.luau \
            src/shared/Objects/ObjectGenomeFixtures.luau \
            src/shared/Objects/ObjectGenomeOwnership.luau \
            tests/object_genome.luau \
            tests/object_genome_contract_lock.luau

      - name: Close final ObjectGenome contract gaps
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          genome_path = Path('src/shared/Objects/ObjectGenome.luau')
          s = genome_path.read_text()

          s = s.replace('''export type DimensionLimits = {\n\tminM: Vec3,\n\tmaxM: Vec3,\n}\n\nexport type ExternalSupport''', '''export type DimensionLimits = {\n\tminM: Vec3,\n\tmaxM: Vec3,\n}\n\nexport type MaterialRecipeRef = {\n\tid: string,\n\trecipeRevision: number,\n}\n\nexport type ExternalSupport''')
          s = s.replace('\tmaterialKey: string,', '\tmaterialRef: MaterialRecipeRef,')
          s = s.replace('''export type ObjectState = {\n\tstateSchemaVersion: number,''', '''export type ObjectState = {\n\tstateSchemaVersion: number,\n\tgenomeId: string,''')
          s = s.replace('''ObjectGenome.STABLE_ID_NAMESPACE = "object-genome"\nObjectGenome.LOCAL_ROTATION_CONVENTION''', '''ObjectGenome.STABLE_ID_NAMESPACE = "object-genome"\nObjectGenome.MATERIAL_BINDING_NAMESPACE = "object-material-binding"\nObjectGenome.MATERIAL_REF_ID_PREFIX = "material.v1."\nObjectGenome.LOCAL_ROTATION_CONVENTION''')
          s = s.replace('''local DEGREES_TO_RADIANS = math.pi / 180\n''', '''local DEGREES_TO_RADIANS = math.pi / 180\nlocal MATERIAL_BINDING_CHUNK_BYTES = 512\nlocal MATERIAL_BINDING_MAX_CHUNKS = 32\n''')

          semantic_anchor = '''local function isSemanticKey(value: any): boolean\n\treturn type(value) == "string" and string.match(value, "^[a-z0-9][a-z0-9._-]*$") ~= nil\nend\n'''
          semantic_add = semantic_anchor + '''\nlocal MATERIAL_REF_KEYS = {\n\tid = true,\n\trecipeRevision = true,\n}\n\nlocal function isMaterialRecipeId(value: any): boolean\n\treturn isSemanticKey(value)\n\t\tand string.sub(value, 1, #ObjectGenome.MATERIAL_REF_ID_PREFIX) == ObjectGenome.MATERIAL_REF_ID_PREFIX\n\t\tand #value > #ObjectGenome.MATERIAL_REF_ID_PREFIX\nend\n\nlocal function validateMaterialRef(issues: { ValidationIssue }, path: string, value: any): ()\n\tif type(value) ~= "table" or getmetatable(value) ~= nil then\n\t\taddIssue(issues, "component.material_ref", path, "materialRef must be a plain-data table")\n\t\treturn\n\tend\n\n\tfor key in pairs(value) do\n\t\tif type(key) ~= "string" or not MATERIAL_REF_KEYS[key] then\n\t\t\taddIssue(\n\t\t\t\tissues,\n\t\t\t\t"component.material_ref_shape",\n\t\t\t\tpath,\n\t\t\t\t`materialRef contains unknown schema key {tostring(key)}`\n\t\t\t)\n\t\tend\n\tend\n\n\tif not isMaterialRecipeId(value.id) then\n\t\taddIssue(\n\t\t\tissues,\n\t\t\t"component.material_ref_id",\n\t\t\tpath .. ".id",\n\t\t\t"materialRef.id must be a stable MaterialDNA v1 project key"\n\t\t)\n\tend\n\tif not isPositiveInteger(value.recipeRevision) then\n\t\taddIssue(\n\t\t\tissues,\n\t\t\t"component.material_ref_revision",\n\t\t\tpath .. ".recipeRevision",\n\t\t\t"materialRef.recipeRevision must be a positive integer"\n\t\t)\n\tend\nend\n'''
          if s.count(semantic_anchor) != 1:
              raise SystemExit('semantic-key anchor mismatch')
          s = s.replace(semantic_anchor, semantic_add)

          old_identity = '''function ObjectGenome.identityParts(value: ObjectGenome): { string }\n\treturn {\n\t\ttostring(value.schemaVersion),\n\t\tvalue.familyId,\n\t\ttostring(value.familyVersion),\n\t\tvalue.variantKey,\n\t}\nend\n\nfunction ObjectGenome.identityKey(value: ObjectGenome): string\n\tObjectGenome.validate(value)\n\treturn StableId.fromParts(ObjectGenome.STABLE_ID_NAMESPACE, ObjectGenome.identityParts(value))\nend\n'''
          new_identity = '''local function materialBindingKeyUnchecked(value: ObjectGenome): string\n\tlocal manifestEntries: { string } = table.create(#value.components)\n\tfor index, component in ipairs(value.components) do\n\t\tmanifestEntries[index] = `{component.key}|{component.materialRef.id}|{component.materialRef.recipeRevision};`\n\tend\n\tlocal manifest = table.concat(manifestEntries)\n\tlocal chunks: { string } = {}\n\tlocal cursor = 1\n\twhile cursor <= #manifest do\n\t\ttable.insert(chunks, string.sub(manifest, cursor, cursor + MATERIAL_BINDING_CHUNK_BYTES - 1))\n\t\tcursor += MATERIAL_BINDING_CHUNK_BYTES\n\tend\n\tassert(#chunks > 0, "ObjectGenome requires at least one material binding")\n\tassert(\n\t\t#chunks <= MATERIAL_BINDING_MAX_CHUNKS,\n\t\t`ObjectGenome material binding manifest exceeds {MATERIAL_BINDING_MAX_CHUNKS * MATERIAL_BINDING_CHUNK_BYTES} bytes`\n\t)\n\treturn StableId.fromParts(ObjectGenome.MATERIAL_BINDING_NAMESPACE, chunks)\nend\n\nfunction ObjectGenome.materialBindingKey(value: ObjectGenome): string\n\tObjectGenome.validate(value)\n\treturn materialBindingKeyUnchecked(value)\nend\n\nfunction ObjectGenome.identityParts(value: ObjectGenome): { string }\n\treturn {\n\t\ttostring(value.schemaVersion),\n\t\tvalue.familyId,\n\t\ttostring(value.familyVersion),\n\t\tvalue.variantKey,\n\t\tmaterialBindingKeyUnchecked(value),\n\t}\nend\n\nfunction ObjectGenome.identityKey(value: ObjectGenome): string\n\tObjectGenome.validate(value)\n\treturn StableId.fromParts(ObjectGenome.STABLE_ID_NAMESPACE, ObjectGenome.identityParts(value))\nend\n'''
          if s.count(old_identity) != 1:
              raise SystemExit('identity block mismatch')
          s = s.replace(old_identity, new_identity)

          old_material_validation = '''\t\tif not isNonEmptyString(component.materialKey) then\n\t\t\taddIssue(\n\t\t\t\tissues,\n\t\t\t\t"component.material_key",\n\t\t\t\tpath .. ".materialKey",\n\t\t\t\t"opaque stable materialKey required"\n\t\t\t)\n\t\tend\n'''
          if s.count(old_material_validation) != 1:
              raise SystemExit('material validation block mismatch')
          s = s.replace(old_material_validation, '\t\tvalidateMaterialRef(issues, path .. ".materialRef", component.materialRef)\n')

          old_rotation = '''\t\tif not isVec3(component.localRotationDeg) then\n\t\t\taddIssue(\n\t\t\t\tissues,\n\t\t\t\t"component.rotation",\n\t\t\t\tpath .. ".localRotationDeg",\n\t\t\t\t"localRotationDeg must be a finite Vec3"\n\t\t\t)\n\t\tend\n'''
          new_rotation = '''\t\tif not isVec3(component.localRotationDeg) then\n\t\t\taddIssue(\n\t\t\t\tissues,\n\t\t\t\t"component.rotation",\n\t\t\t\tpath .. ".localRotationDeg",\n\t\t\t\t"localRotationDeg must be a finite Vec3"\n\t\t\t)\n\t\telseif\n\t\t\tcomponent.localRotationDeg.x < -180\n\t\t\tor component.localRotationDeg.x >= 180\n\t\t\tor component.localRotationDeg.y < -180\n\t\t\tor component.localRotationDeg.y >= 180\n\t\t\tor component.localRotationDeg.z < -180\n\t\t\tor component.localRotationDeg.z >= 180\n\t\tthen\n\t\t\taddIssue(\n\t\t\t\tissues,\n\t\t\t\t"component.rotation_range",\n\t\t\t\tpath .. ".localRotationDeg",\n\t\t\t\t"localRotationDeg components must use the canonical half-open range [-180, 180)"\n\t\t\t)\n\t\tend\n'''
          if s.count(old_rotation) != 1:
              raise SystemExit('rotation block mismatch')
          s = s.replace(old_rotation, new_rotation)

          s = s.replace('''function ObjectGenome.defaultState(value: ObjectGenome): ObjectState\n\tObjectGenome.validate(value)''', '''function ObjectGenome.defaultState(value: ObjectGenome): ObjectState\n\tlocal genomeId = ObjectGenome.identityKey(value)''')
          s = s.replace('''\treturn {\n\t\tstateSchemaVersion = ObjectGenome.STATE_SCHEMA_VERSION,\n\t\tcomponentWear = componentWear,''', '''\treturn {\n\t\tstateSchemaVersion = ObjectGenome.STATE_SCHEMA_VERSION,\n\t\tgenomeId = genomeId,\n\t\tcomponentWear = componentWear,''')
          state_anchor = '''\tif state.stateSchemaVersion ~= ObjectGenome.STATE_SCHEMA_VERSION then\n\t\taddIssue(\n\t\t\tissues,\n\t\t\t"state.schema_version",\n\t\t\t"stateSchemaVersion",\n\t\t\t"unsupported ObjectState schema version"\n\t\t)\n\tend\n'''
          state_add = state_anchor + '''\tlocal expectedGenomeId = ObjectGenome.identityKey(genome)\n\tif state.genomeId ~= expectedGenomeId then\n\t\taddIssue(\n\t\t\tissues,\n\t\t\t"state.genome_id",\n\t\t\t"genomeId",\n\t\t\t"ObjectState genomeId must match the exact immutable ObjectGenome identity"\n\t\t)\n\tend\n'''
          if s.count(state_anchor) != 1:
              raise SystemExit('state schema anchor mismatch')
          s = s.replace(state_anchor, state_add)
          genome_path.write_text(s)

          ownership_path = Path('src/shared/Objects/ObjectGenomeOwnership.luau')
          s = ownership_path.read_text()
          s = s.replace('type ComponentSpec = ObjectGenome.ComponentSpec\n', 'type MaterialRecipeRef = ObjectGenome.MaterialRecipeRef\ntype ComponentSpec = ObjectGenome.ComponentSpec\n')
          s = s.replace('\tmaterialKey = true,', '\tmaterialRef = true,')
          insert_after = '''local COMPONENT_KEYS = {\n\tkey = true,\n\trole = true,\n\tmaterialRef = true,\n\tmassKg = true,\n\tlocalPositionM = true,\n\tlocalRotationDeg = true,\n\tdimensionsM = true,\n\tsupportKeys = true,\n\texternalSupport = true,\n}\n'''
          if s.count(insert_after) != 1:
              raise SystemExit('ownership component key anchor mismatch')
          s = s.replace(insert_after, insert_after + '''\nlocal MATERIAL_REF_KEYS = {\n\tid = true,\n\trecipeRevision = true,\n}\n''')
          shape_anchor = '''\t\tassertRecordShape(component, COMPONENT_KEYS, path)\n\t\tassertVec3Shape(component.localPositionM, path .. ".localPositionM")'''
          s = s.replace(shape_anchor, '''\t\tassertRecordShape(component, COMPONENT_KEYS, path)\n\t\tassertRecordShape(component.materialRef, MATERIAL_REF_KEYS, path .. ".materialRef")\n\t\tassertVec3Shape(component.localPositionM, path .. ".localPositionM")''')
          clone_anchor = '''local function cloneComponent(value: ComponentSpec): ComponentSpec\n'''
          clone_material = '''local function cloneMaterialRef(value: MaterialRecipeRef): MaterialRecipeRef\n\treturn {\n\t\tid = value.id,\n\t\trecipeRevision = value.recipeRevision,\n\t}\nend\n\n'''
          if s.count(clone_anchor) != 1:
              raise SystemExit('clone component anchor mismatch')
          s = s.replace(clone_anchor, clone_material + clone_anchor)
          s = s.replace('\t\tmaterialKey = value.materialKey,', '\t\tmaterialRef = cloneMaterialRef(value.materialRef),')
          ownership_path.write_text(s)

          fixtures_path = Path('src/shared/Objects/ObjectGenomeFixtures.luau')
          s = fixtures_path.read_text()
          s = s.replace('type Vec3 = ObjectGenome.Vec3\n', 'type Vec3 = ObjectGenome.Vec3\ntype MaterialRecipeRef = ObjectGenome.MaterialRecipeRef\n')
          s = s.replace('''-- Production-contract examples. Material keys are opaque references on purpose:\n-- ObjectGenome must not own MaterialDNA's schema or Roblox asset bindings.\nlocal zero: Vec3''', '''-- Production-contract examples pin exact MaterialDNA identity+recipeRevision pairs.\n-- ObjectGenome owns only this plain-data reference shape, never MaterialDNA internals or Roblox asset bindings.\nlocal function material(id: string, recipeRevision: number?): MaterialRecipeRef\n\treturn {\n\t\tid = id,\n\t\trecipeRevision = recipeRevision or 1,\n\t}\nend\n\nlocal zero: Vec3''')
          material_map = {
              'material:polymer-rubber.caster.v1': 'material.v1.furniture.caster-polymer-rubber',
              'material:painted-steel.black.v1': 'material.v1.office-metal.warm-gray-enamel',
              'material:steel-mechanism.dark.v1': 'material.v1.office-metal.warm-gray-enamel',
              'material:fabric-foam.charcoal.v1': 'material.v1.furniture.fabric-foam-charcoal',
              'material:polypropylene.black.v1': 'material.v1.furniture.polypropylene-black',
              'material:painted-steel.gray.v1': 'material.v1.office-metal.warm-gray-enamel',
              'material:laminate-particleboard.beige.v1': 'material.v1.furniture.laminate-particleboard-beige',
              'material:painted-steel.warm-gray.v1': 'material.v1.office-metal.warm-gray-enamel',
          }
          for old, new in material_map.items():
              s = s.replace(f'materialKey = "{old}"', f'materialRef = material("{new}")')
          if 'materialKey' in s:
              raise SystemExit('fixture materialKey remained after migration')
          fixtures_path.write_text(s)

          test_path = Path('tests/object_genome.luau')
          s = test_path.read_text()
          golden_map = {
              'object-genome:v1:51c5fd2813c6dfc8b3e089570b0632af': 'object-genome:v1:613b5df1d6d948938d348c131eb4ca25',
              'object-genome:v1:44d2ee4894de4c20184e7e2a91c876e4': 'object-genome:v1:cb084064e4d21150604f0cff9c22ca55',
              'object-genome:v1:7bd8b9e0c82d36ae53374a390fe2f969': 'object-genome:v1:f2d5a8760c2c3e572ab67e7907aeabd7',
          }
          for old, new in golden_map.items():
              s = s.replace(old, new)
          s = s.replace('''\t\tlocal state = ObjectGenome.defaultState(fixture.genome)\n\t\texpect(\n\t\t\tfixture.name .. " default mutable state validates",''', '''\t\tlocal state = ObjectGenome.defaultState(fixture.genome)\n\t\texpect(\n\t\t\tfixture.name .. " default state is bound to exact genome identity",\n\t\t\tstate.genomeId == identity\n\t\t)\n\t\texpect(\n\t\t\tfixture.name .. " default mutable state validates",''')
          old_bad_material = '''\tlocal badMaterial = deepCopy(Fixtures.officeChair)\n\tbadMaterial.components[1].materialKey = ""\n\texpect(\n\t\t"rejects missing material assignment",\n\t\thasCode(ObjectGenome.inspect(badMaterial), "component.material_key")\n\t)\n'''
          new_bad_material = '''\tlocal badMaterial = deepCopy(Fixtures.officeChair)\n\tbadMaterial.components[1].materialRef.id = ""\n\texpect(\n\t\t"rejects missing material assignment",\n\t\thasCode(ObjectGenome.inspect(badMaterial), "component.material_ref_id")\n\t)\n\n\tlocal badMaterialRevision = deepCopy(Fixtures.officeChair)\n\tbadMaterialRevision.components[1].materialRef.recipeRevision = 0\n\texpect(\n\t\t"rejects non-positive material recipe revision",\n\t\thasCode(ObjectGenome.inspect(badMaterialRevision), "component.material_ref_revision")\n\t)\n\n\tlocal changedMaterialRevision = deepCopy(Fixtures.officeChair)\n\tchangedMaterialRevision.components[1].materialRef.recipeRevision += 1\n\texpect(\n\t\t"material recipe revision participates in canonical object identity",\n\t\tObjectGenome.identityKey(changedMaterialRevision) ~= ObjectGenome.identityKey(Fixtures.officeChair)\n\t)\n\n\texpect(\n\t\t"filing cabinet pins landed MaterialDNA painted-metal revision",\n\t\tFixtures.filingCabinet.components[1].materialRef.id == "material.v1.office-metal.warm-gray-enamel"\n\t\t\tand Fixtures.filingCabinet.components[1].materialRef.recipeRevision == 1\n\t)\n'''
          if s.count(old_bad_material) != 1:
              raise SystemExit('bad material test anchor mismatch')
          s = s.replace(old_bad_material, new_bad_material)
          state_insert_anchor = '''\tlocal invalidForAssert = deepCopy(Fixtures.officeTable)\n'''
          state_tests = '''\tlocal missingGenomeId = ObjectGenome.defaultState(Fixtures.officeChair)\n\tmissingGenomeId.genomeId = nil\n\texpect(\n\t\t"rejects mutable state without genome identity",\n\t\thasCode(ObjectGenome.inspectState(Fixtures.officeChair, missingGenomeId), "state.genome_id")\n\t)\n\n\tlocal chairState = ObjectGenome.defaultState(Fixtures.officeChair)\n\tlocal compatibleDifferentRevision = deepCopy(Fixtures.officeChair)\n\tcompatibleDifferentRevision.familyVersion += 1\n\texpect(\n\t\t"rejects state from structurally compatible different genome revision",\n\t\thasCode(ObjectGenome.inspectState(compatibleDifferentRevision, chairState), "state.genome_id")\n\t)\n\n'''
          if s.count(state_insert_anchor) != 1:
              raise SystemExit('state tests anchor mismatch')
          s = s.replace(state_insert_anchor, state_tests + state_insert_anchor)
          test_path.write_text(s)

          lock_path = Path('tests/object_genome_contract_lock.luau')
          s = lock_path.read_text()
          rotation_insert = '''\texpect(\n\t\t"rotation-aware bounds reject back extending outside envelope",\n\t\thasCode(ObjectGenome.inspect(rotatedBack), "component.outside_bounds")\n\t)\n'''
          rotation_more = rotation_insert + '''\n\tlocal nonCanonicalRotation = deepCopy(Fixtures.officeChair)\n\tnonCanonicalRotation.components[1].localRotationDeg = { x = 180, y = 0, z = 0 }\n\texpect(\n\t\t"rejects duplicate +180 degree Euler endpoint",\n\t\thasCode(ObjectGenome.inspect(nonCanonicalRotation), "component.rotation_range")\n\t)\n\n\tlocal negativeEndpointRotation = deepCopy(Fixtures.officeChair)\n\tnegativeEndpointRotation.components[1].localRotationDeg = { x = -180, y = 0, z = 0 }\n\texpect(\n\t\t"accepts canonical -180 degree Euler endpoint",\n\t\tnot hasCode(ObjectGenome.inspect(negativeEndpointRotation), "component.rotation_range")\n\t)\n\n\t-- Golden discriminator: for back dimensions 0.48x0.48x0.07 at XYZ 30/45/60,\n\t-- fixed-parent Rz*Ry*Rx gives Y half-extent ~=0.33419m. At y=0.27m this\n\t-- exceeds the 1.08m envelope half-height; intrinsic Rx*Ry*Rz would ~=0.26524m and fit.\n\tlocal mixedAxisRotation = deepCopy(Fixtures.officeChair)\n\tfor _, component in ipairs(mixedAxisRotation.components) do\n\t\tif component.key == "back" then\n\t\t\tcomponent.localPositionM = { x = 0, y = 0.27, z = 0.05 }\n\t\t\tcomponent.localRotationDeg = { x = 30, y = 45, z = 60 }\n\t\t\tbreak\n\t\tend\n\tend\n\texpect(\n\t\t"mixed-axis golden locks fixed-parent XYZ order",\n\t\thasCode(ObjectGenome.inspect(mixedAxisRotation), "component.outside_bounds")\n\t)\n'''
          if s.count(rotation_insert) != 1:
              raise SystemExit('rotation test anchor mismatch')
          s = s.replace(rotation_insert, rotation_more)
          freeze_anchor = '''\t\texpect(\n\t\t\tfixture.name .. " fixture nested transform is frozen",\n\t\t\ttable.isfrozen(fixture.genome.components[1].dimensionsM)\n\t\t)\n'''
          freeze_more = freeze_anchor + '''\t\texpect(\n\t\t\tfixture.name .. " fixture material ref is frozen",\n\t\t\ttable.isfrozen(fixture.genome.components[1].materialRef)\n\t\t)\n'''
          if s.count(freeze_anchor) != 1:
              raise SystemExit('freeze test anchor mismatch')
          s = s.replace(freeze_anchor, freeze_more)
          lock_path.write_text(s)

          docs_path = Path('Docs/OBJECT_GENOME.md')
          s = docs_path.read_text()
          s = s.replace('''- `familyId + familyVersion + variantKey + schemaVersion` form the stable genome identity input. `ObjectGenome.identityParts()` is intended to feed the project StableId contract; ObjectGenome does not duplicate hashing/canonical encoding.''', '''- `familyId + familyVersion + variantKey + schemaVersion` form the stable family/version identity core. The exact ordered component MaterialDNA bindings are summarized through a project `StableId` material-binding key and included in `ObjectGenome.identityParts()`, so changing a pinned material recipe revision cannot preserve the same genome identity.''')
          s = s.replace('''- `materialKey` is an opaque stable reference. Objects do not import MaterialDNA implementation details or Roblox asset IDs.''', '''- each component carries `materialRef = { id, recipeRevision }`, pinning exact MaterialDNA recipe truth without importing MaterialDNA implementation details or Roblox asset IDs. The ref is plain data; MaterialDNA/content systems own resolution of the ID.''')
          s = s.replace('''- Mutable state is a complete snapshot for the referenced genome: every component/mechanism key must be present and unknown keys are rejected.''', '''- Mutable state is a complete snapshot for the referenced genome: `ObjectState.genomeId` must equal the exact canonical `ObjectGenome.identityKey(genome)`, every component/mechanism key must be present, and unknown keys are rejected.''')
          s = s.replace('''- for column-vector math, the equivalent rotation matrix is `R = Rz * Ry * Rx`;''', '''- each Euler component uses the canonical half-open range `[-180, 180)`, avoiding duplicate `-180/+180` single-axis encodings;\n- for column-vector math, the equivalent rotation matrix is `R = Rz * Ry * Rx`;''')
          s = s.replace('''- `ObjectGenome.defaultState(genome)` creates separate zeroed mutable state.''', '''- `ObjectGenome.materialBindingKey(genome)` deterministically summarizes ordered component `{id, recipeRevision}` bindings through the project StableId contract.\n- `ObjectGenome.defaultState(genome)` creates separate zeroed mutable state bound to the exact `genomeId`.''')
          s = s.replace('''These are contract fixtures, not final art or Hero Feature implementations. Their purpose is to prove the schema can describe believable manufactured construction without depending on a MeshPart/prefab. Tests also pass these recipes through the immutable ownership boundary before treating them as retained canonical data.''', '''These are contract fixtures, not final art or Hero Feature implementations. Their purpose is to prove the schema can describe believable manufactured construction without depending on a MeshPart/prefab. Material references use MaterialDNA's `material.v1.*` project-key/revision semantics; the filing cabinet explicitly pins the currently catalogued painted-metal recipe while other furniture material identities remain content-owned references rather than render assets. Tests also pass these recipes through the immutable ownership boundary before treating them as retained canonical data.''')
          docs_path.write_text(s)

          runner_path = Path('tests/run.luau')
          s = runner_path.read_text()
          require_anchor = 'local runMaterialDNA = require("./materialdna_contract")\n'
          if 'local runObjectGenome = require("./object_genome")' not in s:
              if s.count(require_anchor) != 1:
                  raise SystemExit('runner MaterialDNA require anchor mismatch')
              s = s.replace(require_anchor, require_anchor + 'local runObjectGenome = require("./object_genome")\nlocal runObjectGenomeContractLock = require("./object_genome_contract_lock")\n')
          call_anchor = '\t+ runMaterialDNA()\n'
          if '\t+ runObjectGenome()' not in s:
              if s.count(call_anchor) != 1:
                  raise SystemExit('runner MaterialDNA call anchor mismatch')
              s = s.replace(call_anchor, call_anchor + '\t+ runObjectGenome()\n\t+ runObjectGenomeContractLock()\n')
          runner_path.write_text(s)
          PY

      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check
          rokit list

      - name: Generate Rojo sourcemap
        run: rojo sourcemap default.project.json --output sourcemap.json

      - name: Download pinned Roblox type definitions
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.69.0/scripts/globalTypes.d.luau \
            -o globalTypes.d.luau

      - name: Apply pinned StyLua
        run: stylua src tests

      - name: Format check
        run: stylua --check src tests

      - name: Lint
        run: selene src tests

      - name: Luau analysis
        run: luau-lsp analyze --platform=roblox --definitions:@roblox=globalTypes.d.luau --sourcemap=sourcemap.json src

      - name: Canonical randomness audit
        run: |
          python3 scripts/check_canonical_randomness.py --self-test
          python3 scripts/check_canonical_randomness.py

      - name: Shared-domain boundary audit
        run: |
          python3 scripts/check_domain_boundaries.py --self-test
          python3 scripts/check_domain_boundaries.py

      - name: Pure Luau tests
        run: lune run tests/run

