name: Format resolved-region branch

on:
  push:
    branches:
      - agent/reality/9-resolved-region-lock-sol56g7

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/reality/9-resolved-region-lock-sol56g7

      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check

      - name: Repair delta payload boundary and regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          module = Path('src/shared/Reality/ResolvedRegionRecipe.luau')
          text = module.read_text()
          old = 'local canonicalPayload = clonePlainMap(payload or {}, "delta.payload")'
          new = '''local payloadValue: unknown = payload
          if payloadValue == nil then
          \tpayloadValue = {}
          end
          local canonicalPayload = clonePlainMap(payloadValue, "delta.payload")'''
          if old not in text:
              raise SystemExit('expected delta payload boundary marker not found')
          module.write_text(text.replace(old, new, 1))

          test = Path('tests/resolved_region_recipe.luau')
          text = test.read_text()
          marker = '\tlocal cyclicPayload = {}\n'
          insertion = '''\tlocal falsePayloadAccepted = pcall(function()
          \t\tResolvedRegionRecipe.newDelta(2, "invalid-payload-type", nil, false)
          \tend)
          \texpectEqual("delta payload rejects false instead of treating it as missing", falsePayloadAccepted, false)

          '''
          if marker not in text:
              raise SystemExit('expected delta regression marker not found')
          test.write_text(text.replace(marker, insertion + marker, 1))
          PY

      - name: Format source and tests
        run: stylua src tests

      - name: Commit formatted repair
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/Reality/ResolvedRegionRecipe.luau tests/resolved_region_recipe.luau tests/run.luau
          git commit -m "fix(reality): format and harden delta payload boundary"
          git push origin HEAD:agent/reality/9-resolved-region-lock-sol56g7
