name: Repair resolved-region strict types

on:
  push:
    branches:
      - agent/reality/9-resolved-region-lock-clean-sol56g7

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/reality/9-resolved-region-lock-clean-sol56g7

      - name: Repair strict Luau type boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/shared/Reality/ResolvedRegionRecipe.luau')
          text = path.read_text()

          marker = '''export type PlainData = { [string]: unknown }\n\nexport type RegionDelta = {'''
          replacement = '''export type PlainData = { [string]: unknown }\n\nexport type SerializedRecipe = {\n\tschemaVersion: number,\n\tregionId: string,\n\tfingerprint: string,\n\tworldId: string,\n\tworldSeedRef: string,\n\tregionAddress: RegionAddress,\n\tgeneratorVersions: GeneratorVersions,\n\tsemanticIntent: string,\n\ttopologyAnchorKeys: { string },\n\tcanonicalContentKeys: { string },\n}\n\nexport type RegionDelta = {'''
          if marker not in text:
              raise SystemExit('serialized recipe type marker not found')
          text = text.replace(marker, replacement, 1)

          old = 'function ResolvedRegionRecipe.serialize(recipe: ResolvedRegionRecipe): PlainData'
          new = 'function ResolvedRegionRecipe.serialize(recipe: ResolvedRegionRecipe): SerializedRecipe'
          if old not in text:
              raise SystemExit('serialize signature marker not found')
          text = text.replace(old, new, 1)

          old = 'assert(getmetatable(delta) == nil, "delta must not have a metatable")'
          new = 'assert(getmetatable(delta :: any) == nil, "delta must not have a metatable")'
          if old not in text:
              raise SystemExit('delta metatable marker not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check

      - name: Format repaired source
        run: stylua src tests

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/Reality/ResolvedRegionRecipe.luau
          git commit -m "fix(reality): satisfy strict serialized/delta types"
          git push origin HEAD:agent/reality/9-resolved-region-lock-clean-sol56g7
