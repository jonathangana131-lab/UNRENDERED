name: Compose ObjectGenome ProductionLoader

on:
  push:
    branches:
      - agent/integration/6-objectgenome-final-sol56q4

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/integration/6-objectgenome-final-sol56q4
          fetch-depth: 0

      - name: Install pinned toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check

      - name: Compose test-only production loader
        shell: bash
        run: |
          cat > tests/support/ProductionLoader.luau <<'EOF'
          local fs = require("@lune/fs")
          local luau = require("@lune/luau")

          local ProductionLoader = {}

          local NodeMetatable = {}
          NodeMetatable.__index = function(node, key)
          	if key == "Name" then
          		return rawget(node, "_name")
          	elseif key == "Parent" then
          		return rawget(node, "_parent")
          	elseif key == "ClassName" then
          		return if rawget(node, "_isModule") then "ModuleScript" else "Folder"
          	end

          	local children = rawget(node, "_children")
          	return children[key]
          end

          local function newNode(name, parent, path, isModule)
          	return setmetatable({
          		_name = name,
          		_parent = parent,
          		_path = path,
          		_isModule = isModule,
          		_children = {},
          	}, NodeMetatable)
          end

          local root = newNode("shared", nil, "src/shared", false)

          local function scanDirectory(path, parent)
          	for _, entryName in fs.readDir(path) do
          		local childPath = `{path}/{entryName}`
          		if fs.isDir(childPath) then
          			local child = newNode(entryName, parent, childPath, false)
          			parent._children[entryName] = child
          			scanDirectory(childPath, child)
          		elseif fs.isFile(childPath) then
          			local moduleName = string.match(entryName, "^(.*)%.luau$")
          				or string.match(entryName, "^(.*)%.lua$")
          			if moduleName ~= nil then
          				parent._children[moduleName] = newNode(moduleName, parent, childPath, true)
          			end
          		end
          	end
          end

          scanDirectory(root._path, root)

          local moduleCache = {}
          local loading = {}

          local loadNode

          local function productionRequire(target)
          	if type(target) ~= "table" or getmetatable(target) ~= NodeMetatable or not target._isModule then
          		error("ProductionLoader only supports Roblox-style ModuleScript references", 2)
          	end
          	return loadNode(target)
          end

          loadNode = function(node)
          	local path = node._path
          	local cached = moduleCache[path]
          	if cached ~= nil then
          		return cached
          	end
          	if loading[path] then
          		error(`ProductionLoader circular require: {path}`, 2)
          	end
          	loading[path] = true

          	local environment = {
          		script = node,
          		require = productionRequire,
          	}
          	local chunk = luau.load(fs.readFile(path), {
          		debugName = path,
          		environment = environment,
          		injectGlobals = true,
          	})
          	local result = chunk()
          	loading[path] = nil

          	if result == nil then
          		error(`ProductionLoader module returned nil: {path}`, 2)
          	end
          	moduleCache[path] = result
          	return result
          end

          function ProductionLoader.requireShared(modulePath)
          	assert(type(modulePath) == "string" and modulePath ~= "", "modulePath must be a non-empty string")

          	local node = root
          	for segment in string.gmatch(modulePath, "[^/]+") do
          		node = node._children[segment]
          		assert(node ~= nil, `ProductionLoader missing shared module path segment {segment} in {modulePath}`)
          	end
          	assert(node._isModule, `ProductionLoader target is not a ModuleScript: {modulePath}`)
          	return loadNode(node)
          end

          return table.freeze(ProductionLoader)
          EOF
          sed -i 's/^          //' tests/support/ProductionLoader.luau

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("tests/object_genome.luau"): (
                  'local StableId = require("../src/shared/Core/StableId")\n'
                  'local ObjectGenome = require("../src/shared/Objects/ObjectGenome")\n'
                  'local Fixtures = require("../src/shared/Objects/ObjectGenomeFixtures")\n',
                  'local ProductionLoader = require("./support/ProductionLoader")\n\n'
                  'local StableId = ProductionLoader.requireShared("Core/StableId")\n'
                  'local ObjectGenome = ProductionLoader.requireShared("Objects/ObjectGenome")\n'
                  'local Fixtures = ProductionLoader.requireShared("Objects/ObjectGenomeFixtures")\n',
              ),
              Path("tests/object_genome_contract_lock.luau"): (
                  'local ObjectGenome = require("../src/shared/Objects/ObjectGenome")\n'
                  'local Fixtures = require("../src/shared/Objects/ObjectGenomeFixtures")\n'
                  'local ObjectGenomeOwnership = require("../src/shared/Objects/ObjectGenomeOwnership")\n',
                  'local ProductionLoader = require("./support/ProductionLoader")\n\n'
                  'local ObjectGenome = ProductionLoader.requireShared("Objects/ObjectGenome")\n'
                  'local Fixtures = ProductionLoader.requireShared("Objects/ObjectGenomeFixtures")\n'
                  'local ObjectGenomeOwnership = ProductionLoader.requireShared("Objects/ObjectGenomeOwnership")\n',
              ),
          }

          for path, (old, new) in replacements.items():
              source = path.read_text()
              if not source.startswith(old):
                  raise SystemExit(f"unexpected loader prefix in {path}")
              path.write_text(new + source[len(old):])
          PY

          stylua tests/object_genome.luau tests/object_genome_contract_lock.luau tests/support/ProductionLoader.luau
          rm .github/workflows/compose-objectgenome-production-loader.yml

      - name: Commit composed loader
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(objects): load production modules under Lune"
          git push origin HEAD:agent/integration/6-objectgenome-final-sol56q4
