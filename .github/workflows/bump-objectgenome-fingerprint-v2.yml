name: Bump ObjectGenome fingerprint encoding v2

on:
  push:
    branches:
      - agent/objects/100-fingerprint-canonical-sol56u3

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Bump ObjectGenome recipe fingerprint encoding to v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/objects/100-fingerprint-canonical-sol56u3
          fetch-depth: 0

      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh \
            | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check

      - name: Apply fingerprint revision patch
        run: python3 .github/scripts/bump_objectgenome_fingerprint_v2.py

      - name: Format before fingerprint probe
        run: stylua src/shared/Objects/ObjectGenome.luau tests/object_genome.luau

      - name: Generate v2 fixture fingerprint goldens
        shell: bash
        run: |
          cat > tests/_fingerprint_probe.luau <<'LUAU'
          local ProductionLoader = require("./support/ProductionLoader")
          local ObjectGenome = ProductionLoader.requireShared("Objects/ObjectGenome")
          local Fixtures = ProductionLoader.requireShared("Objects/ObjectGenomeFixtures")

          assert(ObjectGenome.RECIPE_FINGERPRINT_VERSION == 2, "fingerprint probe must run revision 2")
          print("officeChair=" .. ObjectGenome.recipeFingerprint(Fixtures.officeChair))
          print("officeTable=" .. ObjectGenome.recipeFingerprint(Fixtures.officeTable))
          print("filingCabinet=" .. ObjectGenome.recipeFingerprint(Fixtures.filingCabinet))
          LUAU
          lune run tests/_fingerprint_probe > /tmp/objectgenome-fingerprints-v2.txt
          cat /tmp/objectgenome-fingerprints-v2.txt
          python3 .github/scripts/bump_objectgenome_fingerprint_v2.py \
            --goldens /tmp/objectgenome-fingerprints-v2.txt
          rm tests/_fingerprint_probe.luau
          stylua src/shared/Objects/ObjectGenome.luau tests/object_genome.luau

      - name: Validate corrected source
        shell: bash
        run: |
          stylua --check src tests
          selene src tests
          lune run tests/run
          mkdir -p build
          rojo build default.project.json --output build/UNRENDERED.rbxlx

      - name: Retire transport and commit v2 repair
        shell: bash
        run: |
          rm .github/scripts/bump_objectgenome_fingerprint_v2.py
          rm .github/workflows/bump-objectgenome-fingerprint-v2.yml
          git config user.name "unrendered-swarm"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Bump ObjectGenome recipe fingerprint encoding to v2"
          git push origin HEAD:agent/objects/100-fingerprint-canonical-sol56u3
